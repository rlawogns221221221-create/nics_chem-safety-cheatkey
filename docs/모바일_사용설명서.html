<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>화학사고 초동대응 지원 서비스 — 사용 설명서</title>
<!--
  휴대전화 사용설명서 원본 — PDF 를 고치지 말고 이 파일을 고친 뒤
  `node build/make_mobile_guide.mjs` 로 다시 구우세요(사진도 다시 찍습니다).

  ⚠ 지키는 것 (2026-10-27 사용자)
    · 사용법만 적습니다. "도구 ○개" 같은 소개 · "도구는 판단하지 않습니다" 같은
      원칙 문구는 넣지 않습니다.
    · 글은 사진마다 한 줄. 사진이 설명합니다.
    · 「걸음」이라는 낱말을 쓰지 않습니다 — 사진 속 글자까지 빌드가 검사합니다.
    · 차례는 진입 화면 카드와 같습니다(01 방제 → 02 대피장소 → 03 문자).
    · 첫 장은 QR 두 개뿐입니다 — 서비스 접속 · 만족도 조사(2026-10-27 사용자).
      나머지 넉 장은 그 뒤에 그대로 둡니다("방금 만든 사용 설명서는 너무 마음에 들어").
-->
<style>
@font-face{font-family:"Pretendard GOV";font-weight:400;
  src:url("../assets/fonts/PretendardGOV-Regular.subset.woff2") format("woff2")}
@font-face{font-family:"Pretendard GOV";font-weight:700;
  src:url("../assets/fonts/PretendardGOV-Bold.subset.woff2") format("woff2")}
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:"Pretendard GOV","Noto Sans CJK KR",sans-serif;color:#1d1d1d;
  word-break:keep-all;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;padding:13mm 12mm 10mm;overflow:hidden;
  page-break-after:always;break-after:page;position:relative}
.page:last-child{page-break-after:auto;break-after:auto}

/* 쪽 머리 — 번호와 이름만 */
.ph{display:flex;align-items:center;gap:4mm;margin:0 0 7mm;padding-bottom:4mm;
  border-bottom:.6mm solid #256ef4}
.ph .no{font-size:7mm;font-weight:700;color:#256ef4;letter-spacing:-.02em}
.ph h2{margin:0;font-size:7mm;font-weight:700;letter-spacing:-.03em}

/* 사진 여섯 장 — 세 칸 두 줄 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:7mm;row-gap:8mm}
figure{margin:0}
.shot{display:block;width:100%;border:1.6mm solid #1d1d1d;border-radius:5mm;
  background:#1d1d1d;overflow:hidden}
.shot img{display:block;width:100%;border-radius:3.4mm}
figcaption{display:flex;align-items:flex-start;gap:2mm;margin-top:3mm;
  font-size:3.9mm;font-weight:700;line-height:1.35;letter-spacing:-.02em}
figcaption i{flex:none;display:grid;place-items:center;width:5.6mm;height:5.6mm;
  border-radius:50%;background:#ff3b30;color:#fff;font-style:normal;font-size:3.3mm;
  margin-top:-.2mm}

/* 첫 장 — 표지. 위쪽 파란 띠에 제목, 아래에 QR 두 개(2026-10-27 사용자 —
   "사용설명서의 첫 장이라는 느낌이 나도록"). 만족도 조사 카드는 붉은 테두리로
   접속 카드(파랑)와 한눈에 갈립니다. */
.qrs{padding:0;display:flex;flex-direction:column}
.cv{background:#256ef4;color:#fff;padding:34mm 16mm 16mm}
/* 서비스 이름은 크게 — 6mm 로 두었더니 "우리 서비스의 이름인데 너무 작다"
   (2026-10-27 사용자). 한 줄에 들어가는 크기까지만 키웠습니다. */
.cv p{margin:0;font-size:11mm;font-weight:700;letter-spacing:-.04em;line-height:1.25}
.cv h1{margin:4mm 0 0;font-size:17mm;font-weight:700;letter-spacing:-.05em;line-height:1.15}
.qb{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 12mm 6mm}
.two{display:grid;grid-template-columns:1fr 1fr;column-gap:10mm}
.qc{border:.8mm solid #d6dbe1;border-radius:6mm;padding:9mm 6mm 8mm;text-align:center}
.qc h2{margin:0 0 7mm;font-size:8.4mm;font-weight:700;letter-spacing:-.03em}
.qc img{display:block;width:72mm;height:72mm;margin:0 auto}
.qc p{margin:6mm 0 0;font-size:4.2mm;color:#464c53;letter-spacing:.01em}
.qc.go{border-color:#256ef4}
.qc.go h2{color:#256ef4}
.qc.ask{border-color:#e0352b}
.qc.ask h2{color:#e0352b}
.qrs .how{margin:12mm 0 0;text-align:center;font-size:5mm;font-weight:700}

/* 2쪽 — 제목 · 첫 화면 사진(가운데) · 차례. 홈 화면에 추가 안내는 걷어냈습니다
   (2026-10-27 사용자 — "홈화면에 추가하는 기능은 삭제를 해버리고 … 가운데로"). */
.cover .brand{font-size:4.6mm;font-weight:700;color:#256ef4;margin:6mm 0 2mm}
.cover h1{margin:0 0 10mm;font-size:12mm;font-weight:700;letter-spacing:-.04em;line-height:1.2}
.open{width:88mm;margin:0 auto}
.open figcaption{justify-content:center;font-size:4.6mm;margin-top:5mm}
.open figcaption i{width:6.4mm;height:6.4mm;font-size:3.8mm}
.toc{list-style:none;margin:10mm 0 0;padding:0;border-top:.3mm solid #d6dbe1}
.toc li{display:flex;align-items:center;gap:4mm;padding:4mm 1mm;
  border-bottom:.3mm solid #d6dbe1;font-size:4.8mm;font-weight:700}
.toc li b{color:#256ef4;width:9mm}
.toc li span{margin-left:auto;color:#8a949e;font-weight:400;font-size:4mm}
</style>
</head>
<body>

<!-- ── 1쪽 · QR 두 개 ──────────────────────────────────────── -->
<section class="page qrs">
  <div class="cv">
    <p>화학사고 초동대응 지원 서비스</p>
    <h1>사용 설명서</h1>
  </div>
  <div class="qb">
    <div class="two">
      <div class="qc go">
        <h2>서비스 접속</h2>
        <img src="QR/QR_접속.svg" alt="서비스 접속 QR 코드">
        <p>chem-safety-kr.pages.dev</p>
      </div>
      <div class="qc ask">
        <h2>만족도 조사</h2>
        <img src="QR/QR_만족도조사.svg" alt="만족도 조사 QR 코드">
        <p>naver.me/FaeWaurT</p>
      </div>
    </div>
    <p class="how">휴대전화 카메라로 비추세요</p>
  </div>
</section>

<!-- ── 2쪽 · 사용 설명서 — 첫 화면 · 차례 ──────────────────────── -->
<section class="page cover">
  <p class="brand">화학사고 초동대응 지원 서비스</p>
  <h1>사용 설명서</h1>
  <div class="open">
    <figure>
      <div class="shot"><img src="모바일설명서/00-첫화면.png" alt=""></div>
      <figcaption><i>1</i>필요한 서비스를 누르세요</figcaption>
    </figure>
  </div>
  <ol class="toc">
    <li><b>01</b>방제 물품·장비 찾기<span>3쪽</span></li>
    <li><b>02</b>주민 대피장소 찾기<span>4쪽</span></li>
    <li><b>03</b>주민대피 문자생성기<span>5쪽</span></li>
  </ol>
</section>

<!-- ── 3쪽 · 01 방제 물품·장비 찾기 ───────────────────────────── -->
<section class="page">
  <header class="ph"><span class="no">01</span><h2>방제 물품·장비 찾기</h2></header>
  <div class="grid">
    <figure><div class="shot"><img src="모바일설명서/11-무엇을.png" alt=""></div>
      <figcaption><i>1</i>찾을 것을 고르세요</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/12-물품고르기.png" alt=""></div>
      <figcaption><i>2</i>필요한 물품을 누르고 다음</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/13-사고지점.png" alt=""></div>
      <figcaption><i>3</i>사고 장소를 넣으세요</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/14-지도.png" alt=""></div>
      <figcaption><i>4</i>아래로 내리면 목록이 나옵니다</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/15-목록.png" alt=""></div>
      <figcaption><i>5</i>한 곳을 누르세요</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/16-세부창.png" alt=""></div>
      <figcaption><i>6</i>번호를 누르면 바로 전화됩니다</figcaption></figure>
  </div>
</section>

<!-- ── 4쪽 · 02 주민 대피장소 찾기 ──────────────────────────────── -->
<section class="page">
  <header class="ph"><span class="no">02</span><h2>주민 대피장소 찾기</h2></header>
  <div class="grid">
    <figure><div class="shot"><img src="모바일설명서/21-주소넣기.png" alt=""></div>
      <figcaption><i>1</i>주소나 장소 이름을 넣으세요</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/22-지도누르기.png" alt=""></div>
      <figcaption><i>2</i>지도를 한 번 눌러 정하세요</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/23-결과.png" alt=""></div>
      <figcaption><i>3</i>가까운 대피장소가 나옵니다</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/24-층고르기.png" alt=""></div>
      <figcaption><i>4</i>볼 대피장소를 켜고 끄세요</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/25-길찾기.png" alt=""></div>
      <figcaption><i>5</i>누르면 길찾기로 이어집니다</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/26-문자로.png" alt=""></div>
      <figcaption><i>6</i>그대로 문자 만들기로 넘어갑니다</figcaption></figure>
  </div>
</section>

<!-- ── 5쪽 · 03 주민대피 문자생성기 ─────────────────────────────── -->
<section class="page">
  <header class="ph"><span class="no">03</span><h2>주민대피 문자생성기</h2></header>
  <div class="grid">
    <figure><div class="shot"><img src="모바일설명서/31-알림고르기.png" alt=""></div>
      <figcaption><i>1</i>보낼 알림을 고르세요</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/32-칸채우기.png" alt=""></div>
      <figcaption><i>2</i>칸을 채우고 다음</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/33-물질.png" alt=""></div>
      <figcaption><i>3</i>물질은 앞 글자만 쳐도 나옵니다</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/34-빈칸.png" alt=""></div>
      <figcaption><i>4</i>빈칸은 눌러서 바로 채우세요</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/35-대피장소.png" alt=""></div>
      <figcaption><i>5</i>대피장소는 지도에서 고르세요</figcaption></figure>
    <figure><div class="shot"><img src="모바일설명서/36-복사.png" alt=""></div>
      <figcaption><i>6</i>문안을 복사해 쓰세요</figcaption></figure>
  </div>
</section>

</body>
</html>
