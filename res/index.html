<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화학사고 방제자원 지도</title>
<link rel="stylesheet" href="../assets/shell.css">
</head>
<body class="mapapp">

<div class="top">
  <div class="wrap">
    <h1>화학사고 방제자원 지도</h1>
    <div class="act noprint">
      <button id="btnSrc" type="button">자료 출처</button>
      <button id="btnPrint" type="button">인쇄</button>
      <button id="btnClear" type="button">초기화</button>
    </div>
  </div>
</div>

<!-- ── 조건 ─────────────────────────────────────────────── -->
<div class="mbar noprint">
  <div class="mbar-in">
    <label class="mb-f mb-addr" title="주소·시군구·읍면동은 물론 보유 장비 이름으로도 찾습니다(굴착기·흡착포 등).">
      주소·장소·장비 검색
      <input type="text" id="mAddrQ" placeholder="예) 김천시, 굴착기, 흡착포" autocomplete="off">
    </label>
    <!-- 좁은 화면에서는 아래 조건들이 세로로 쌓여 지도를 밀어냅니다.
         주소 검색만 남기고 접어 두었다가 이 단추로 펴 봅니다(넓은 화면에서는
         접을 이유가 없으므로 이 단추가 보이지 않습니다). -->
    <button type="button" class="mb-toggle" id="mbToggle" aria-expanded="false" aria-controls="mbMore">
      조건 더보기
      <svg class="mb-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div class="mb-more" id="mbMore">
      <label class="mb-f">영향반경 참고 물질<input type="text" id="mMat" data-matpicker autocomplete="off"></label>
      <div class="mb-f mb-wind">
        풍향
        <button type="button" id="windBtn" class="windbtn" aria-haspopup="dialog" aria-expanded="false">
          <svg class="windbtn-ic" id="windBtnIc" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
          </svg>
          <span id="windBtnTxt">설정 안 함</span>
        </button>
      </div>
      <div class="mb-lyr" id="mLyr" role="group" aria-label="배경지도 선택"></div>
    </div>
  </div>
  <!-- 자원 종류(무엇을 가진 곳인가) · 필요한 것(지금 나에게 필요한 물건).
       담당자는 보통 종류를 모르고 필요한 물건만 압니다 — 둘 다 둡니다. -->
  <div class="rbar noprint">
    <div class="rbar-row">
      <span class="rbar-t">자원 종류</span>
      <div class="rk-chips" id="rKinds" role="group" aria-label="자원 종류 고르기"></div>
    </div>
    <div class="rbar-row">
      <span class="rbar-t">필요한 것</span>
      <div class="rk-chips" id="rNeeds" role="group" aria-label="필요한 것으로 찾기"></div>
    </div>
  </div>
</div>

<!-- 주소·장소 검색 결과 -->
<div class="mpk noprint" id="addrPop" hidden></div>

<!-- 풍향 고르기 — 나침반 -->
<div class="windpop noprint" id="windPop" hidden role="dialog" aria-label="풍향 고르기"></div>

<div class="mbar-warn" id="mWarn" hidden></div>
<div class="mrad noprint" id="mRad" hidden></div>

<!-- ── 사고지점 요약 ─────────────────────────────────────── -->
<div class="msum" id="mSum" hidden></div>

<!-- ── 지도 + 목록 ──────────────────────────────────────── -->
<div class="mmain">
  <div class="mmap">
    <svg id="map" role="img" aria-label="화학사고 방제자원 지도"></svg>

    <div class="mapctl noprint">
      <button id="zIn" type="button" title="확대">＋</button>
      <button id="zOut" type="button" title="축소">−</button>
      <button id="zFit" type="button" title="전체 보기">⤢</button>
    </div>

    <div class="maplegend" id="mLeg"></div>

    <!-- 급할 때 필요한 세 줄 — 오른쪽 목록을 훑지 않고 바로 읽습니다 -->
    <div class="mnear" id="mNear" hidden></div>

    <div class="mapscale"><i id="scaleBar"></i><b id="scaleTxt"></b></div>
    <div class="mapaddr" id="mAddr" hidden></div>
    <div class="mtoast noprint" id="mToast" hidden></div>

    <div class="mapacc noprint">
      <button id="btnAcc" type="button" class="sm">사고지점 찍기</button>
      <button id="btnMe" type="button" class="sm btnme" title="이 기기의 위치를 지도에 표시합니다">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="8.4"/>
          <path d="M12 1.4v3M12 19.6v3M1.4 12h3M19.6 12h3"/>
        </svg>내 위치</button>
      <label>위도<input type="text" id="acLat" inputmode="decimal"></label>
      <label>경도<input type="text" id="acLon" inputmode="decimal"></label>
      <button id="btnAccClear" type="button" class="sm" title="사고지점 지우기">×</button>
      <span class="mapchks">
        <label class="mapchk" title="고른 자원이 있는 곳까지 실제 도로 경로를 찾아 그립니다. 인터넷이 필요하며, 사고지점 좌표가 길찾기 서버로 전송됩니다. 끄면 직선으로만 표시합니다.">
          <input type="checkbox" id="cWalk" checked>도로 경로</label>
        <label class="mapchk"><input type="checkbox" id="cRings" checked>거리 눈금</label>
      </span>
    </div>
  </div>

  <div class="mside">
    <div class="ms-find noprint">
      <div class="ms-find-row">
        <label class="mb-f">시·도<select id="mSido"></select></label>
        <label class="mb-f">시·군·구<select id="mSgg"></select></label>
      </div>
      <label class="mb-f wide" title="방제자원은 관내에 아예 없는 경우가 흔해, 사고지점을 찍으면 반경 20km 부터 봅니다">
        찾는 범위<select id="mScope">
          <option value="">선택한 시·군·구 관내</option>
          <option value="5000">사고지점 반경 5km</option>
          <option value="10000">사고지점 반경 10km</option>
          <option value="20000">사고지점 반경 20km</option>
          <option value="50000">사고지점 반경 50km</option>
          <option value="100000">사고지점 반경 100km</option>
        </select>
      </label>
    </div>
    <!-- 여러 곳에 연달아 전화를 거는 일이라, 고른 곳을 담아 두었다가
         이름·번호·거리를 한 번에 복사해 상황실 기록으로 넘깁니다. -->
    <div class="rmob noprint" id="rMob" hidden></div>

    <div class="ms-hd">방제자원 <span id="listCnt"></span></div>
    <div class="ms-tools noprint">
      <input type="text" id="mQ" placeholder="이름·주소·장비로 찾기" aria-label="방제자원 검색" autocomplete="off">
      <select id="mSort" aria-label="정렬">
        <option value="name">이름순</option>
        <option value="dist">사고지점 가까운 순</option>
        <option value="kind">자원 종류순</option>
      </select>
    </div>
    <div class="ms-list" id="shList"></div>
  </div>
</div>

<!-- ── 자료 출처 창 ─────────────────────────────────────── -->
<div class="cbx-back" id="srcModal" hidden>
  <div class="cbx">
    <header><b>자료 출처 · 사용 시 주의</b>
      <button type="button" class="cbx-x" id="btnSrcClose" aria-label="닫기">✕</button></header>
    <div class="alert w cbx-alert"><b>참고도구</b>이 지도는 등록된 방제자원의 위치를 확인하는
      참고도구입니다. 어느 자원을 동원할지는 도구가 판단하지 않습니다.
      <b>보유 수량은 원자료 제출 시점의 것</b>이며 지금 쓸 수 있는지는 전화로 확인해야 합니다.
      좌표는 원자료에 없어 <b>주소로 잡은 어림값</b>이라 건마다 정확도가 다릅니다(각 줄에 표시).
      거리는 지형·도로를 고려하지 않은 <b>직선거리</b>입니다.</div>
    <div class="cbx-body" id="ver"></div>
  </div>
</div>

<script src="../data/version.js"></script>
<script src="../data/basemap.js"></script>
<script src="../data/materials.js"></script>
<script src="../data/shelters.js"></script>
<script src="../data/resources.js"></script>
<!-- 정확 좌표 — build/geocode.html 로 만들면 생기는 파일입니다. 없으면 그냥
     넘어갑니다(주소로 잡은 어림 좌표를 씁니다). 단일 파일판을 만들 때는
     있으면 넣고 없으면 이 줄을 뺍니다(build/build_single.py). -->
<script src="../data/resources.geo.js"></script>
<script src="../data/boundaries.js"></script>
<script src="../assets/matpicker.js"></script>
<script src="../assets/mapcore.js"></script>
<!-- 인터넷이 있어야 되는 것(장소 검색·사고지점 주소·도로 경로).
     방제자원 자료에서 담당자 개인정보를 모두 걷어냈으므로 ③ 도 씁니다.
     나가는 것은 사용자가 친 검색어와 사고지점 좌표뿐이고, 업체 정보는
     나가지 않습니다. 없어도 화면은 그대로 돕니다. -->
<script src="../assets/online.js"></script>
<script src="app.js"></script>
</body>
</html>
