# ═══════════════════════════════════════════════════════════════
#  이재민 임시주거시설 자료 받아 오기 (행정안전부 오픈API)
#
#  ── 왜 이것이 필요한가 ────────────────────────────────────
#  개발 자리에서는 `www.safetydata.go.kr` 로 나갈 수 없습니다(게이트웨이가
#  403 으로 막습니다). 그래서 지금까지 이 자료 하나만 비어 있었고, 사람이
#  인터넷 되는 PC 에서 `build/fetch_tempshelter.html` 을 눌러 받아야 했습니다.
#
#  **깃허브 액션 러너는 인터넷이 됩니다.** 그래서 같은 일을 여기서 돌리고,
#  만들어진 `data/tempshelters.js` 를 저장소에 넣습니다. 휴대전화만 있어도
#  자료가 채워집니다.
#
#  ── 무엇을 하지 않는가 ────────────────────────────────────
#  **아무것도 배포하지 않습니다.** 시범운영 링크는 닫혀 있고(pages.yml 의
#  SITE_OPEN: "no") 이 워크플로는 그것을 건드리지 않습니다. 하는 일은
#  자료 파일 하나를 만들어 커밋하는 것뿐입니다.
#
#  ── 돌리는 법 ─────────────────────────────────────────────
#  저장소 → Actions → "이재민 임시주거시설 자료 받기" → Run workflow.
#  칸 이름만 확인하고 싶으면 peek 를 true 로 두면 파일을 만들지 않습니다.
#
#  ── 인증키 ────────────────────────────────────────────────
#  `build/fetch_tempshelter.html` 에 적혀 있는 값을 그대로 씁니다(사용자가
#  "열면 바로 돌게 해 달라"고 해서 넣어 둔 것). 저장소 Secrets 에
#  TEMPSHELTER_KEY 를 넣어 두면 그쪽을 먼저 씁니다 — 키를 저장소에서
#  빼내고 싶을 때 그렇게 하면 됩니다.
# ═══════════════════════════════════════════════════════════════
name: 이재민 임시주거시설 자료 받기

on:
  workflow_dispatch:
    inputs:
      peek:
        description: "칸 이름만 확인 (파일을 만들지 않음)"
        type: boolean
        default: false
      url:
        description: "자료 주소 (비우면 build/fetch_tempshelter.html 의 값)"
        type: string
        default: ""

permissions:
  contents: write        # 만들어진 자료 파일을 커밋하기 위해서만 씁니다

concurrency:
  group: tempshelter-fetch
  cancel-in-progress: false

jobs:
  # ⚠ 잡 id 는 영문·숫자·_·- 만 됩니다(깃허브 규칙 — 한국어를 쓰면
  #   "The identifier is invalid" 로 워크플로가 아예 안 돕니다).
  #   눈에 보이는 이름은 name 으로 한국어를 둡니다.
  fetch:
    name: 오픈API 로 받기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 오픈API 로 받아 data/tempshelters.js 만들기
        env:
          TEMPSHELTER_KEY: ${{ secrets.TEMPSHELTER_KEY }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.peek }}" = "true" ]; then ARGS="$ARGS --peek"; fi
          if [ -n "${{ inputs.url }}" ]; then ARGS="$ARGS --url ${{ inputs.url }}"; fi
          python3 build/fetch_tempshelter.py $ARGS 2>&1 | tee 받기기록.txt

      # ‼ 여기서는 **자료 파일 하나만** 만들어 넣습니다.
      #   화면 검증(tests/run.sh tmp2)과 단일 파일 다시 만들기는 개발 자리에서
      #   합니다 — CI 에 브라우저까지 깔면 실패할 자리가 늘어나고, 정작 필요한
      #   것(이 서버에서 자료를 받아 오는 것)은 이 한 걸음뿐입니다.
      - name: 저장소에 넣기
        if: ${{ inputs.peek != true }}
        run: |
          test -f data/tempshelters.js || { echo "자료 파일이 만들어지지 않았습니다"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tempshelters.js
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다 — 커밋하지 않습니다."
            exit 0
          fi
          N=$(grep -o '"총건수": [0-9]*' data/tempshelters.js | head -1 | grep -o '[0-9]*')
          git commit -m "이재민 임시주거시설 자료를 넣었습니다 — ${N:-?}곳

          행정안전부 오픈API 에서 받아 data/tempshelters.js 를 만들었습니다.
          개발 자리에서는 그 서버로 나갈 수 없어(게이트웨이가 403) 이 워크플로가
          대신 받습니다 — build/fetch_tempshelter.py.

          화면 검증과 단일 파일 다시 만들기는 개발 자리에서 이어서 합니다."
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 받기기록
          path: |
            받기기록.txt
            data/tempshelters.js
          if-no-files-found: warn
          retention-days: 14
