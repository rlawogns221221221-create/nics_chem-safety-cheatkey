# ═══════════════════════════════════════════════════════════════
#  성과 이미지 굽기 (배경지도까지 나오게)
#
#  ── 왜 필요한가 ───────────────────────────────────────────
#  성과요약서의 `참고 2`(이미지 양식)에 들어갈 사진입니다. 주최 측이
#  **성과사례집·카드뉴스에 쓴다**며 고화질을 요구했는데, 개발 자리는
#  배경지도 타일 서버로 못 나가(CONNECT 403) 지도 사진에 **행정경계선만**
#  찍힙니다. 실제로 내는 사진은 인터넷이 되는 러너에서 굽습니다.
#  (시연 영상을 여기서 굽는 것과 같은 이유 — 시연영상_녹화.yml 참고)
#
#  ── 무엇을 하나 ───────────────────────────────────────────
#  `build/make_shots.mjs` 로 사진 5장을 찍고, 그것을 줄여
#  (`build/사진줄이기.mjs`) 참고 1·2 의 **PDF 두 가지와 한글파일**을
#  다시 구워 **이 가지에 커밋**합니다. 아무것도 배포하지 않습니다.
#
#  ── 돌리는 법 ─────────────────────────────────────────────
#  저장소 → Actions → "성과 이미지 굽기" → Run workflow.
# ═══════════════════════════════════════════════════════════════
name: 성과 이미지 굽기

on:
  workflow_dispatch:

permissions:
  contents: write        # 찍은 사진·PDF 를 커밋하기 위해서만 씁니다

concurrency:
  group: shots-bake
  cancel-in-progress: false

jobs:
  # ⚠ 잡 id 는 영문·숫자·_·- 만 됩니다(한국어를 쓰면 워크플로가 안 돕니다).
  bake:
    name: 화면 사진 굽기
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 찍고 나서 "타일이 안 왔다"를 아는 것은 늦습니다 — 먼저 한 장 받아 봅니다.
      - name: 배경지도 타일이 받아지는지 확인
        run: |
          KEY=$(sed -n 's/.*인증키: *"\([^"]*\)".*/\1/p' data/basemap.js | head -1)
          probe() {
            R=$(curl -sS -o /tmp/tile.png -w '%{http_code} %{size_download}바이트 %{content_type}' \
                --max-time 25 "$2" 2>&1 || echo "받지 못함")
            echo "  $1 → $R"
          }
          echo "배경지도 타일 확인 (200 · image/png 이면 사진에 도로·건물이 나옵니다)"
          probe "브이월드     " "https://api.vworld.kr/req/wmts/1.0.0/$KEY/Base/12/1720/3510.png"
          probe "OpenStreetMap" "https://tile.openstreetmap.org/12/3510/1720.png"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 크로미움 · 한글 글꼴 준비
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          # 화면 글꼴은 저장소 안의 Pretendard GOV 를 쓰지만 **부분집합**이라
          # 없는 글자가 두부(□)로 나올 수 있어 시스템 한글 글꼴을 깔아 둡니다.
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 사진 찍고 PDF·한글파일 굽기
        run: |
          # ⚠ `set -o pipefail` 이 없으면 tee 의 성공이 node 의 실패를 덮습니다.
          set -o pipefail
          node build/make_shots.mjs 2>&1 | tee 사진기록.txt
          node build/사진줄이기.mjs 2>&1 | tee -a 사진기록.txt
          node build/make_summary.mjs 2>&1 | tee -a 사진기록.txt
          python3 build/make_summary_hwpx.py 2>&1 | tee -a 사진기록.txt

      - name: 사진 올려 두기 (내려받기용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 성과이미지
          path: |
            docs/성과이미지
            docs/화학안전치트키_성과요약서.pdf
            docs/화학안전치트키_이미지.pdf
            docs/화학안전치트키_성과요약서.hwpx
            사진기록.txt

      - name: 저장소에 넣기
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/성과이미지 docs/화학안전치트키_성과요약서.pdf \
                  docs/화학안전치트키_이미지.pdf docs/화학안전치트키_성과요약서.hwpx
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "성과요약서 이미지를 배경지도가 나오는 자리에서 다시 찍었습니다
          
          개발 자리는 타일 서버가 막혀(CONNECT 403) 지도에 경계선만 나왔습니다.
          주최 측이 성과사례집·카드뉴스에 쓴다며 고화질을 요구해, 인터넷이 되는
          액션 러너에서 같은 스크립트(build/make_shots.mjs)를 돌렸습니다."
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
