# ═══════════════════════════════════════════════════════════════
#  결선 영상 「사고 흐름 판」(3분 20초 안팎) 굽기 (배경지도까지)
#
#  ── 왜 필요한가 ───────────────────────────────────────────
#  build/make_flow_video_long.mjs 가 휴대전화 화면을 실제로 눌러 가며 녹화하는데, 개발 자리는
#  배경지도 타일 서버로 못 나가 지도에 경계선만 나옵니다(CLAUDE.md 6절). 인터넷이 되는 러너에서
#  녹화합니다 — 결선영상_흐름_굽기.yml 과 같은 이유입니다.
#
#  ── 03 화면은 다른 커밋의 코드로 ───────────────────────────────
#  「안전원 상황실로 바로 전화」 링크는 다른 작업 가지의 커밋 a869d46 에만 있습니다. 그 커밋을
#  .narr/상황실판 으로 꺼내 `--상황실` 로 넘기면, 녹화 서버가 03 화면과 그 화면이 부르는 것만
#  그 폴더에서 냅니다(나머지는 이 가지 그대로).
#
#  ── 무엇을 커밋하나 ───────────────────────────────────────
#  · source/녹화/사고흐름_원본.mp4 · .json — 휴대전화 화면 녹화본과 장면 시각(타이머의 근거).
#    이것이 있으면 개발 자리에서 `엮기` 만 다시 돌려 자막을 고칠 수 있습니다(다시 녹화 안 함).
#  · docs/공모전_결선_사고흐름.mp4 — 사고 카드·자막·타이머·음악까지 얹은 결과.
#
#  ── 언제 도나 ─────────────────────────────────────────────
#  · 스크립트·무대·음악을 이 가지에 올리면 저절로 돕니다(push). 결과물은 아래 paths 에 없어
#    커밋해도 다시 돌지 않습니다.
# ═══════════════════════════════════════════════════════════════
name: 결선 영상 사고흐름 판 굽기

on:
  push:
    branches: [claude/affectionate-mendel-gvdnjk]
    paths:
      - build/make_flow_video_long.mjs
      - build/영상_사고흐름무대.html
      - build/make_flow_music_long.py
      - .github/workflows/결선영상_사고흐름_굽기.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-incident-flow-video
  cancel-in-progress: true

env:
  # 상황실 바로 전화 링크가 들어간 커밋(다른 작업 가지 · 2026-11-18)
  CALL_COMMIT: a869d460a694568b4219c4b83ddcf349cc6ddbcb

jobs:
  # ⚠ 잡 id 는 영문·숫자·_·- 만 됩니다
  bake:
    name: 휴대전화 화면 녹화하고 mp4 굽기
    # ⚠ ubuntu-latest 를 쓰지 마세요 — Playwright 1.56.1 이 26.04 를 몰라 크로미움 설치에서 멈춥니다
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write      # 구운 영상을 커밋하기 위해서만 씁니다
    steps:
      - uses: actions/checkout@v4

      - name: 상황실 기능이 있는 03 코드를 꺼내기
        run: |
          git fetch --no-tags --depth=1 origin "$CALL_COMMIT"
          git worktree add --detach .narr/상황실판 FETCH_HEAD
          grep -q rk-emg-tel .narr/상황실판/res/app.js && echo "03 상황실 전화 링크 있음"

      - name: 배경지도 타일이 받아지는지 확인
        run: |
          R=$(curl -sS -o /tmp/tile.png -w '%{http_code} %{size_download}바이트 %{content_type}' \
              --max-time 25 "https://tile.openstreetmap.org/12/3510/1720.png" 2>&1 || echo "받지 못함")
          echo "OpenStreetMap → $R (200 · image/png 이면 영상에 도로·건물이 나옵니다)"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 크로미움 · 한글 글꼴 · ffmpeg · 음악용 numpy 준비
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk ffmpeg
          python -m pip install numpy

      - name: 녹화하고 엮기
        env:
          FFPRESET: medium
          PYTHON: python
        run: |
          # ⚠ `set -o pipefail` 이 없으면 tee 의 성공이 node 의 실패를 덮습니다.
          set -o pipefail
          node build/make_flow_video_long.mjs 둘다 --상황실 .narr/상황실판 2>&1 | tee 사고흐름영상기록.txt

      - name: 결과 올려 두기 (내려받기용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 결선영상-사고흐름판
          path: |
            docs/공모전_결선_사고흐름.mp4
            source/녹화/사고흐름_원본.json
            사고흐름영상기록.txt

      - name: 저장소에 넣기
        run: |
          git worktree remove --force .narr/상황실판 || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/공모전_결선_사고흐름.mp4 source/녹화/사고흐름_원본.mp4 source/녹화/사고흐름_원본.json
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "결선 영상 사고흐름 판을 배경지도까지 넣어 녹화했습니다

          개발 자리는 타일 서버가 막혀 있어(CLAUDE.md 6절) 인터넷이 되는 액션
          러너에서 build/make_flow_video_long.mjs 를 돌려 휴대전화 화면을 녹화하고
          가상 사고 카드·자막·타이머·음악을 얹었습니다."
          # 그사이 다른 판이 같은 파일을 올려 두었으면 이 단계가 만든 쪽을 남깁니다
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
