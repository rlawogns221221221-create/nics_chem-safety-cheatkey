# ═══════════════════════════════════════════════════════════════
#  시연 영상 녹화 (배경지도까지 나오게)
#
#  ── 왜 이것이 필요한가 ────────────────────────────────────
#  개발 자리에서는 배경지도 타일 서버로 나갈 수 없습니다 — 게이트웨이가
#  `api.vworld.kr` 도 `tile.openstreetmap.org` 도 CONNECT 403 으로 끊습니다.
#  그래서 거기서 녹화한 영상은 지도에 **행정경계선만** 나옵니다.
#
#  **깃허브 액션 러너는 인터넷이 됩니다.** 같은 녹화 스크립트
#  (`build/make_demo.mjs`)를 여기서 돌리면 도로·건물이 함께 찍힙니다.
#  스크립트는 화면에 실제로 그려진 타일을 세어 자막을 스스로 고릅니다 —
#  타일이 오면 "배경지도를 못 받았다"는 자막이 나오지 않습니다.
#
#  ── 무엇을 하지 않는가 ────────────────────────────────────
#  **아무것도 배포하지 않습니다.** 하는 일은 영상 파일 하나를 만들어
#  작업 가지에 커밋하는 것뿐입니다(`pages.yml` 은 건드리지 않습니다).
#
#  ── 돌리는 법 ─────────────────────────────────────────────
#  저장소 → Actions → "시연 영상 녹화" → Run workflow.
#  타일이 받아지는지만 보고 싶으면 `peek` 를 true 로 둡니다(20초면 끝납니다).
#
#  ── 어느 배경지도가 찍히나 (2026-09-08 실제로 확인함) ─────
#  러너에서 두 곳을 불러 봤습니다 —
#    브이월드      → 502 (107바이트 text/html)  ← 인증키의 활용 도메인 때문
#    OpenStreetMap → 200 (6,987바이트 image/png) ← 이것이 찍힙니다
#  화면이 스스로 넘어갑니다(`data/basemap.js` 의 `대체순서`). 도구에 원래
#  있는 기능이고 사용자도 화면 위에서 고를 수 있으므로, 영상도 실제 화면
#  그대로입니다. 아래 확인 단계가 매번 어느 쪽이 살아 있는지 적어 줍니다.
#  ※ OSM 타일은 한 번 녹화에 수백 장 정도만 받습니다(그쪽 이용정책이
#    금지하는 대량 내려받기가 아닙니다). 자주 돌리지 마세요.
# ═══════════════════════════════════════════════════════════════
name: 시연 영상 녹화

on:
  workflow_dispatch:
    inputs:
      peek:
        description: "배경지도 타일이 받아지는지만 확인 (녹화하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write        # 만들어진 영상 파일을 커밋하기 위해서만 씁니다

concurrency:
  group: demo-record
  cancel-in-progress: false

jobs:
  # ⚠ 잡 id 는 영문·숫자·_·- 만 됩니다(한국어를 쓰면 워크플로가 안 돕니다).
  record:
    name: 화면 녹화
    runs-on: ubuntu-latest
    # 녹화 3분 + mp4 굽기. 러너는 코어가 둘뿐이라 넉넉히 둡니다
    # (`slow` 로 구웠더니 30분을 넘겼습니다 — 아래 FFPRESET 참고).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 20분 녹화하고 나서 "타일이 안 왔다"를 아는 것은 늦습니다.
      # 먼저 한 장씩 받아 보고 로그에 남깁니다.
      - name: 배경지도 타일이 받아지는지 확인
        run: |
          KEY=$(sed -n 's/.*인증키: *"\([^"]*\)".*/\1/p' data/basemap.js | head -1)
          probe() {
            R=$(curl -sS -o /tmp/tile.png -w '%{http_code} %{size_download}바이트 %{content_type}' \
                --max-time 25 "$2" 2>&1 || echo "받지 못함")
            echo "  $1 → $R"
          }
          echo "배경지도 타일 확인 (200 · image/png 이면 영상에 배경지도가 나옵니다)"
          probe "브이월드     " "https://api.vworld.kr/req/wmts/1.0.0/$KEY/Base/12/1720/3510.png"
          probe "OpenStreetMap" "https://tile.openstreetmap.org/12/3510/1720.png"

          # 영상에서 사고지점을 **사업장 이름으로** 찾으려면 이 검색이 살아 있어야
          # 합니다(assets/online.js 가 부르는 그 주소 그대로). 안 되면 이름을 쳐도
          # 결과가 비어 영상에 빈 목록이 찍힙니다 — 녹화 전에 확인합니다.
          #
          # 브이월드 인증키는 **활용 도메인**이 걸려 있어 호출한 자리(Referer)를
          # 봅니다. 그래서 같은 질의를 ① 그냥 ② 배포 주소를 Referer 로 붙여
          # 두 번 걸어 봅니다 — ②가 되면 배포 주소에서 녹화하면 됩니다.
          SITE=https://chem-safety-kr.pages.dev
          Q=$(printf 'SK하이닉스 청주공장' | jq -sRr @uri 2>/dev/null \
              || printf 'SK%%ED%%95%%98%%EC%%9D%%B4%%EB%%8B%%89%%EC%%8A%%A4')
          SEARCH="https://api.vworld.kr/req/search?service=search&request=search&version=2.0&crs=EPSG:4326&size=10&page=1&format=json&errorformat=json&type=place&query=$Q&key=$KEY"
          echo "장소 검색 확인 (SK하이닉스 청주공장)"
          echo "  ① Referer 없이"
          curl -sS --max-time 25 -o /tmp/s1.json -w '     HTTP %{http_code}\n' "$SEARCH" || true
          head -c 300 /tmp/s1.json | tr -d '\n'; echo
          echo "  ② Referer: $SITE"
          curl -sS --max-time 25 -H "Referer: $SITE/" -o /tmp/s2.json \
            -w '     HTTP %{http_code}\n' "$SEARCH" || true
          head -c 300 /tmp/s2.json | tr -d '\n'; echo
          echo "  ③ 배포 주소가 열려 있는지"
          curl -sS --max-time 25 -o /tmp/site.html -w '     HTTP %{http_code} %{size_download}바이트\n' "$SITE/" || true
          grep -o '1,849곳\|17,754\|5,792' /tmp/site.html | sort -u | tr '\n' ' '; echo
          echo "  ④ 배포 주소를 Referer 로 타일"
          curl -sS --max-time 25 -H "Referer: $SITE/" -o /tmp/t2.png \
            -w '     HTTP %{http_code} %{content_type}\n' \
            "https://api.vworld.kr/req/wmts/1.0.0/$KEY/Base/12/1720/3510.png" || true

      - uses: actions/setup-node@v4
        if: ${{ inputs.peek != true }}
        with:
          node-version: "22"

      - name: 크로미움 · 한글 글꼴 · ffmpeg 준비
        if: ${{ inputs.peek != true }}
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          # 화면 글꼴은 저장소 안의 Pretendard GOV 를 쓰지만 **부분집합**이라
          # 없는 글자가 두부(□)로 나올 수 있어 시스템 한글 글꼴을 깔아 둡니다.
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: 녹화
        if: ${{ inputs.peek != true }}
        # mp4 굽기가 러너에서 너무 오래 걸리면 `FFPRESET: veryfast` 를 여기
        # env 로 넣으세요(crf 는 24 그대로라 화질 차이는 작습니다).
        run: node build/make_demo.mjs 2>&1 | tee 녹화기록.txt

      # 커밋이 막히거나 다시 손보고 싶을 때를 대비해 내려받을 수 있게 둡니다.
      # 실패해도 올립니다 — 3분짜리 녹화를 통째로 잃지 않기 위해서입니다.
      - name: 영상 올려 두기 (내려받기용)
        if: ${{ always() && inputs.peek != true }}
        uses: actions/upload-artifact@v4
        with:
          name: 시연영상
          path: |
            docs/AI프렌즈_시연영상.mp4
            docs/AI프렌즈_시연영상.webm
            녹화기록.txt
          if-no-files-found: warn

      - name: 저장소에 넣기
        if: ${{ inputs.peek != true }}
        run: |
          test -f docs/AI프렌즈_시연영상.mp4 || { echo "영상이 만들어지지 않았습니다"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AI프렌즈_시연영상.mp4
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "시연 영상을 배경지도가 나오는 자리에서 다시 녹화했습니다

          개발 자리는 타일 서버가 막혀(CONNECT 403) 지도에 경계선만 나왔습니다.
          인터넷이 되는 액션 러너에서 같은 녹화 스크립트(build/make_demo.mjs)를
          돌려 도로·건물이 함께 찍히게 했습니다.

          자막은 화면에 실제로 그려진 타일을 세어 고릅니다 — 배경지도가 나오면
          '못 받았다'는 자막이 나오지 않습니다."
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
