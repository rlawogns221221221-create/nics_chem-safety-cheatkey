# ═══════════════════════════════════════════════════════════════
#  시연 영상 녹화 (배경지도까지 나오게)
#
#  ── 왜 이것이 필요한가 ────────────────────────────────────
#  개발 자리에서는 배경지도 타일 서버로 나갈 수 없습니다 — 게이트웨이가
#  `api.vworld.kr` 도 `tile.openstreetmap.org` 도 CONNECT 403 으로 끊습니다.
#  그래서 거기서 녹화한 영상은 지도에 **행정경계선만** 나옵니다.
#
#  **깃허브 액션 러너는 인터넷이 됩니다.** 같은 녹화 스크립트
#  (`build/make_demo.mjs`)를 여기서 돌리면 도로·건물이 함께 찍힙니다.
#  스크립트는 화면에 실제로 그려진 타일을 세어 자막을 스스로 고릅니다 —
#  타일이 오면 "배경지도를 못 받았다"는 자막이 나오지 않습니다.
#
#  ── 무엇을 하지 않는가 ────────────────────────────────────
#  **아무것도 배포하지 않습니다.** 하는 일은 영상 파일 하나를 만들어
#  작업 가지에 커밋하는 것뿐입니다(`pages.yml` 은 건드리지 않습니다).
#
#  ── 돌리는 법 ─────────────────────────────────────────────
#  저장소 → Actions → "시연 영상 녹화" → Run workflow.
#  타일이 받아지는지만 보고 싶으면 `peek` 를 true 로 둡니다(20초면 끝납니다).
#
#  ── 브이월드 인증키에 대하여 ──────────────────────────────
#  `data/basemap.js` 의 키는 **활용 도메인**이 걸려 있어 러너에서는 거부될
#  수 있습니다. 그때는 화면이 스스로 OpenStreetMap 으로 넘어갑니다
#  (`대체순서`) — 도구에 원래 있는 기능이라 영상도 실제 화면 그대로입니다.
#  아래 확인 단계가 어느 쪽이 살아 있는지 로그에 적어 줍니다.
# ═══════════════════════════════════════════════════════════════
name: 시연 영상 녹화

on:
  workflow_dispatch:
    inputs:
      peek:
        description: "배경지도 타일이 받아지는지만 확인 (녹화하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write        # 만들어진 영상 파일을 커밋하기 위해서만 씁니다

concurrency:
  group: demo-record
  cancel-in-progress: false

jobs:
  # ⚠ 잡 id 는 영문·숫자·_·- 만 됩니다(한국어를 쓰면 워크플로가 안 돕니다).
  record:
    name: 화면 녹화
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 20분 녹화하고 나서 "타일이 안 왔다"를 아는 것은 늦습니다.
      # 먼저 한 장씩 받아 보고 로그에 남깁니다.
      - name: 배경지도 타일이 받아지는지 확인
        run: |
          KEY=$(sed -n 's/.*인증키: *"\([^"]*\)".*/\1/p' data/basemap.js | head -1)
          probe() {
            R=$(curl -sS -o /tmp/tile.png -w '%{http_code} %{size_download}바이트 %{content_type}' \
                --max-time 25 "$2" 2>&1 || echo "받지 못함")
            echo "  $1 → $R"
          }
          echo "배경지도 타일 확인 (200 · image/png 이면 영상에 배경지도가 나옵니다)"
          probe "브이월드     " "https://api.vworld.kr/req/wmts/1.0.0/$KEY/Base/12/1720/3510.png"
          probe "OpenStreetMap" "https://tile.openstreetmap.org/12/3510/1720.png"

      - uses: actions/setup-node@v4
        if: ${{ inputs.peek != true }}
        with:
          node-version: "22"

      - name: 크로미움 · 한글 글꼴 · ffmpeg 준비
        if: ${{ inputs.peek != true }}
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          # 화면 글꼴은 저장소 안의 Pretendard GOV 를 쓰지만 **부분집합**이라
          # 없는 글자가 두부(□)로 나올 수 있어 시스템 한글 글꼴을 깔아 둡니다.
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: 녹화
        if: ${{ inputs.peek != true }}
        run: node build/make_demo.mjs 2>&1 | tee 녹화기록.txt

      # 커밋이 막히거나 다시 손보고 싶을 때를 대비해 내려받을 수 있게 둡니다.
      - name: 영상 올려 두기 (내려받기용)
        if: ${{ inputs.peek != true }}
        uses: actions/upload-artifact@v4
        with:
          name: 시연영상
          path: |
            docs/AI프렌즈_시연영상.mp4
            녹화기록.txt
          if-no-files-found: error

      - name: 저장소에 넣기
        if: ${{ inputs.peek != true }}
        run: |
          test -f docs/AI프렌즈_시연영상.mp4 || { echo "영상이 만들어지지 않았습니다"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AI프렌즈_시연영상.mp4
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "시연 영상을 배경지도가 나오는 자리에서 다시 녹화했습니다

          개발 자리는 타일 서버가 막혀(CONNECT 403) 지도에 경계선만 나왔습니다.
          인터넷이 되는 액션 러너에서 같은 녹화 스크립트(build/make_demo.mjs)를
          돌려 도로·건물이 함께 찍히게 했습니다.

          자막은 화면에 실제로 그려진 타일을 세어 고릅니다 — 배경지도가 나오면
          '못 받았다'는 자막이 나오지 않습니다."
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
