# ═══════════════════════════════════════════════════════════════
#  사용자 테스트용 사이트 배포 (GitHub Pages)
#
#      https://rlawogns221221221-create.github.io/nics_chem-safety-cheatkey/
#
#  ⚠⚠ 지금은 **닫혀 있습니다**(SITE_OPEN: "no").
#     시범운영 안내 전에 링크가 여러 곳으로 퍼져 접속이 늘어나서,
#     사용자 요청으로 닫았습니다(2026-09-03).
#     이 주소에는 깃허브 계정 이름이 그대로 보이기도 해서, 어차피
#     지자체에 나눠 줄 링크로는 맞지 않는 주소였습니다.
#
#  ── 다시 여는 법 ──────────────────────────────────────────
#     아래 SITE_OPEN 을 "yes" 로 바꾸고 푸시하면 됩니다. 그것뿐입니다.
#     닫을 때는 다시 "no".
#
#  ── 왜 워크플로를 지우지 않았나 ────────────────────────────
#     워크플로 파일을 지우면 **이미 올라가 있는 것이 그대로 남습니다.**
#     자동 배포만 멈출 뿐 주소는 계속 살아 있어서, 퍼진 링크로 들어오는
#     사람은 아무 변화도 못 느낍니다. 그래서 지우는 대신 **안내문 한 장으로
#     덮어씁니다** — 들어온 사람이 "닫혔구나"를 알게 되고, 도구는 열리지
#     않습니다. (주소 자체를 없애려면 저장소 Settings → Pages 에서 사람이
#     꺼야 합니다 — 워크플로 토큰에는 그 권한이 없습니다)
#
#  ── 저장소 전체를 그대로 올리지 않는 이유 ──────────────────
#  Pages 는 올린 것을 전부 공개합니다. 저장소에는 화면에 필요 없는 것도
#  들어 있습니다.
#      source/  원자료 26MB (대피장소 목록·실제발송사례·물질정보 원본)
#      build/   생성 스크립트     docs/  분석 기록
#  이것들까지 인터넷에 올려 둘 이유가 없으므로, 화면이 실제로 부르는 것만
#  골라서 올립니다.
# ═══════════════════════════════════════════════════════════════
name: 사용자 테스트 사이트 배포

on:
  push:
    branches:
      - claude/chemical-accident-evacuation-sms-hsgoit
      - main
  workflow_dispatch:        # 화면에서 손으로 다시 돌릴 수 있게

env:
  # ── 여기 한 줄이 열림/닫힘을 정합니다 ──────────────────────
  #   "yes" → 도구 전체를 올립니다
  #   "no"  → build/닫힘안내.html 한 장만 올립니다(도구는 안 올라감)
  SITE_OPEN: "no"

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 푸시해도 마지막 것 하나만 올라가게 한다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 개인정보가 섞여 들어갔는지 먼저 막는다 ──────────────
      # 내부판(담당자 개인 연락처 포함)은 .gitignore 로 빠져 있지만,
      # 실수로 커밋되면 이 사이트를 통해 그대로 공개됩니다.
      # 올리기 전에 멈추는 편이 올린 뒤 지우는 것보다 낫습니다.
      # 닫혀 있을 때도 그대로 돌립니다 — 검사를 건너뛰는 습관이 들면
      # 다시 열 때 그대로 새어 나갑니다.
      - name: 내부용 자료가 섞이지 않았는지 확인
        run: |
          if [ -f data/resources.internal.js ]; then
            echo "::error::내부판 데이터(data/resources.internal.js)가 저장소에 들어 있습니다. 공개 배포를 중단합니다."
            exit 1
          fi
          if grep -q '"p":{' data/resources.js; then
            echo "::error::공개판 데이터에 담당자(p) 항목이 있습니다. 공개 배포를 중단합니다."
            exit 1
          fi
          if ls dist/*내부용* >/dev/null 2>&1; then
            echo "::error::dist 에 내부용 단일파일이 있습니다. 공개 배포를 중단합니다."
            exit 1
          fi
          echo "확인 완료 — 공개해도 되는 자료만 있습니다."

      - name: 화면에 필요한 것만 모으기
        run: |
          mkdir -p _site
          # Jekyll 을 거치지 않게 한다. 거치면 한글 파일명과 밑줄로 시작하는
          # 이름이 빠질 수 있고, 배포도 그만큼 느려진다.
          touch _site/.nojekyll

          if [ "$SITE_OPEN" != "yes" ]; then
            # ── 닫힘 — 안내문 한 장만 올린다 ────────────────────
            # 도구·자료·단일파일은 아예 올리지 않습니다. 안 올리면
            # 주소를 직접 쳐서 들어가는 길(/res/ 같은)도 함께 막힙니다.
            cp build/닫힘안내.html _site/index.html
            # 검색에 잡히지 않게 한 겹 더. 안내문 안의 meta 만으로도
            # 되지만, robots.txt 는 페이지를 열기 전에 읽힙니다.
            printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
            echo "닫힘 — 안내문만 올립니다."
            du -sh _site
            exit 0
          fi

          # ── 열림 — 도구 전체 ────────────────────────────────
          cp index.html _site/
          # 매니페스트와 서비스워커는 사이트 뿌리에 있어야 합니다 —
          # sw.js 는 지금 아무 일도 하지 않고 예전에 깔린 것을 지우는
          # 파일입니다(지우면 안 됩니다).
          cp manifest.webmanifest sw.js _site/
          cp -r assets data sms map res _site/
          # 망분리 PC로 옮길 단일 파일도 함께 올린다 — 내부망 담당자가
          # 이 주소에서 내려받아 USB·공유폴더로 옮길 수 있게.
          cp -r dist _site/
          echo "올릴 용량:"; du -sh _site

      # ── 처음 한 번만 손으로 해야 하는 것 ────────────────────
      # 저장소 Settings → Pages → Build and deployment → Source 를
      # "GitHub Actions" 로 바꿔 주세요. 한 번만 하면 그다음부터는
      # 푸시할 때마다 자동으로 올라갑니다.
      #
      # 이 단계를 워크플로가 대신 켜 주게(enablement: true) 해 봤지만,
      # Pages 를 켜는 것은 저장소 관리 권한이 있어야 하고 워크플로에 주어지는
      # 토큰에는 그 권한이 없어 "Resource not accessible by integration" 으로
      # 실패합니다. 그래서 그 한 번은 사람이 눌러야 합니다.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
