# ═══════════════════════════════════════════════════════════════
#  휴대전화 사용설명서 굽기 (배경지도까지 나오게)
#
#  ── 왜 필요한가 ───────────────────────────────────────────
#  설명서 사진의 절반이 지도입니다. 개발 자리는 배경지도 타일 서버로 못 나가
#  (CONNECT 403) 지도에 **행정경계선만** 찍힙니다(CLAUDE.md 6절). 실제로 내는
#  판은 인터넷이 되는 러너에서 굽습니다 — 성과이미지_굽기.yml 과 같은 이유.
#
#  ── 무엇을 하나 ───────────────────────────────────────────
#  `build/make_mobile_guide.mjs` 로 휴대전화 화면 19장을 찍고
#  `docs/모바일_사용설명서.pdf` 를 구워 **이 가지에 커밋**합니다. 배포는 안 합니다.
#  그 스크립트가 「걸음」·「도구는」 같은 말과 쪽수(4)를 검사해 어기면 멈춥니다.
#
#  ── 언제 도나 ─────────────────────────────────────────────
#  · 설명서 원본·스크립트를 이 가지에 올리면 저절로 돕니다(push).
#    — workflow_dispatch 는 기본 가지에 이 파일이 있어야 단추가 생겨서,
#      그 전에도 굽을 수 있게 push 로도 걸어 두었습니다.
#  · 결과(사진·PDF)는 아래 paths 에 없어 커밋해도 다시 돌지 않습니다.
#  · 저장소 → Actions → "휴대전화 사용설명서 굽기" → Run workflow 로도 됩니다.
# ═══════════════════════════════════════════════════════════════
name: 휴대전화 사용설명서 굽기

on:
  push:
    branches: [claude/affectionate-mendel-gvdnjk]
    paths:
      - build/make_mobile_guide.mjs
      - docs/모바일_사용설명서.html
      - .github/workflows/모바일설명서_굽기.yml
  workflow_dispatch:

permissions:
  contents: write        # 찍은 사진·PDF 를 커밋하기 위해서만 씁니다

concurrency:
  group: mobile-guide-bake
  cancel-in-progress: true

jobs:
  # ⚠ 잡 id 는 영문·숫자·_·- 만 됩니다(한국어를 쓰면 워크플로가 안 돕니다).
  bake:
    name: 설명서 사진 찍고 PDF 굽기
    # ⚠ ubuntu-latest 를 쓰지 마세요 — 2026-10 부터 26.04 를 가리키는데
    #   Playwright 1.56.1 이 그 판을 몰라 크로미움 설치에서 멈췄습니다(첫 실행).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 배경지도 타일이 받아지는지 확인
        run: |
          KEY=$(sed -n 's/.*인증키: *"\([^"]*\)".*/\1/p' data/basemap.js | head -1)
          probe() {
            R=$(curl -sS -o /tmp/tile.png -w '%{http_code} %{size_download}바이트 %{content_type}' \
                --max-time 25 "$2" 2>&1 || echo "받지 못함")
            echo "  $1 → $R"
          }
          echo "배경지도 타일 확인 (200 · image/png 이면 사진에 도로·건물이 나옵니다)"
          probe "브이월드     " "https://api.vworld.kr/req/wmts/1.0.0/$KEY/Base/12/1720/3510.png"
          probe "OpenStreetMap" "https://tile.openstreetmap.org/12/3510/1720.png"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 크로미움 · 한글 글꼴 준비
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          # 저장소의 Pretendard GOV 는 부분집합이라 없는 글자가 두부(□)로 나올 수
          # 있어 시스템 한글 글꼴을 깔아 둡니다.
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 사진 찍고 PDF 굽기
        run: |
          # ⚠ `set -o pipefail` 이 없으면 tee 의 성공이 node 의 실패를 덮습니다.
          set -o pipefail
          node build/make_mobile_guide.mjs 2>&1 | tee 설명서기록.txt

      - name: 결과 올려 두기 (내려받기용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 휴대전화-사용설명서
          path: |
            docs/모바일설명서
            docs/모바일_사용설명서.pdf
            설명서기록.txt

      - name: 저장소에 넣기
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/모바일설명서 docs/모바일_사용설명서.pdf
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "휴대전화 사용설명서를 배경지도가 나오는 자리에서 다시 구웠습니다

          개발 자리는 타일 서버가 막혀(CONNECT 403) 지도에 경계선만 나왔습니다.
          인터넷이 되는 액션 러너에서 같은 스크립트(build/make_mobile_guide.mjs)를
          돌려 사진 19장과 PDF 를 다시 만들었습니다."
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
