<!-- ═══════════════════════════════════════════════════════════════
     바탕화면 아이콘 원본 — build/make_icons.mjs 가 이 그림을 PNG 로 굽습니다.

     ── 왜 이 그림인가 ─────────────────────────────────────────
     · 바탕은 KRDS Primary 파랑입니다. 진입 화면 카드와 같은 색이라
       아이콘을 누르면 나오는 화면과 이어져 보입니다.
     · 빨강을 쓰지 않았습니다. 이 도구에서 빨강은 **실제 위험**
       (사고지점·영향반경)에만 씁니다. 아이콘은 위험 표시가 아닙니다.
     · GHS 그림문자(마름모)를 쓰지 않았습니다. 그것은 법으로 뜻이 정해진
       표지라, 도구 아이콘으로 쓰면 없는 뜻을 주장하게 됩니다.
     · 정부상징(태극)도 넣지 않았습니다. 기관의 공식 표장을 아이콘에
       넣는 것은 "공식 앱"이라는 주장이라 기관 승인이 필요합니다.
       승인되면 이 파일만 바꿔 다시 구우면 됩니다.
     · 그래서 남긴 것은 **경고 삼각형 하나**입니다. 48px 로 줄여도
       모양이 뭉개지지 않는 가장 단순한 형태이고, 홈 화면에서는 늘
       "화학사고 초동대응" 이라는 이름과 함께 보입니다.

     ── 안전 영역 ──────────────────────────────────────────────
     512 기준 가운데 지름 410(80%) 안에 그림이 들어가야 합니다.
     안드로이드가 아이콘을 원·둥근사각 등 기기마다 다른 모양으로 잘라내기
     때문입니다(maskable). 삼각형은 지름 300 안에 들어 있습니다.
     ═══════════════════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#256ef4"/>
  <!-- 경고 삼각형 — 굵은 흰 선. 꼭짓점은 둥글려 작은 크기에서 뾰족하게
       튀지 않게 합니다. -->
  <path d="M256 132 L396 366 H116 Z"
        fill="none" stroke="#ffffff" stroke-width="34"
        stroke-linejoin="round"/>
  <!-- 느낌표 — 획과 점. 획을 둥근 끝으로 두어야 작은 크기에서 잘려
       보이지 않습니다. -->
  <path d="M256 218 V286" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
  <circle cx="256" cy="325" r="17" fill="#ffffff"/>
</svg>
