<!-- ═══════════════════════════════════════════════════════════════
     바탕화면 아이콘 원본 — build/make_icons.mjs 가 이 그림을 PNG 로 굽습니다.

     ── 왜 바꿨나 ──────────────────────────────────────────────
     처음에는 **경고 삼각형(!)** 이었습니다. 사용자가 "오류 마크 같아서
     불편한 느낌"이라고 했고, 실제로 그 모양은 어느 화면에서나 **오류·경고**
     로 읽힙니다. 바탕화면에 늘 놓고 보는 아이콘이 "무언가 잘못됐다"고
     말하고 있으면 안 됩니다.

     ── 지금 그림이 뜻하는 것 ──────────────────────────────────
     **방패** 안에 **사고지점 표시(가운데 점 + 원)** 가 있습니다.
       · 방패 — 주민 안전을 지키는 일. 공공 안전 서비스에서 널리 쓰는 형태라
         설명 없이도 "안전"으로 읽힙니다.
       · 가운데 점 + 원 — 이 도구가 지도에 실제로 그리는 것입니다
         (사고지점과 그 둘레의 참고 반경). 도구를 열어 본 사람은 아이콘과
         화면이 같은 것을 가리킨다는 것을 알아봅니다.
     경고가 아니라 **대응**을 뜻하는 그림입니다.

     ── 색 ────────────────────────────────────────────────────
     KRDS Primary 파랑의 옅은 쪽에서 짙은 쪽으로 흐르는 바탕입니다
     (#2f7cf6 → #0b50d0). 진입 화면 카드와 같은 계통이라 아이콘을 누르면
     나오는 화면과 이어져 보입니다.
     **빨강을 쓰지 않았습니다** — 이 도구에서 빨강은 사고지점·영향반경 같은
     **실제 위험**에만 씁니다. 아이콘은 위험 표시가 아닙니다.

     ── 넣지 않은 것 ──────────────────────────────────────────
     · 정부상징(태극) — 기관의 공식 표장을 아이콘에 넣는 것은 "공식 앱"
       이라는 주장이라 기관 승인이 필요합니다.
     · GHS 그림문자(마름모) — 법으로 뜻이 정해진 표지라, 도구 아이콘으로
       쓰면 없는 뜻을 주장하게 됩니다.
     승인이 나면 이 파일만 바꿔 `node build/make_icons.mjs` 를 다시 돌리면
     됩니다. ⚠ 그때 **네 HTML 의 탭 아이콘(data:image/svg+xml)도 같이**
     바꿔야 합니다 — 그것은 주소 안에 그림이 그대로 적혀 있어 이 파일을
     보지 않습니다(tests/pwa 가 둘이 같은 그림인지까지는 못 봅니다).

     ── 안전 영역 ──────────────────────────────────────────────
     512 기준 가운데 지름 410(80%) 안에 그림이 들어가야 합니다. 안드로이드가
     기기마다 다른 모양(원·둥근사각)으로 잘라내기 때문입니다(maskable).
     방패는 가로 292 · 세로 336 으로 그 안에 들어 있습니다.
     ═══════════════════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="바탕" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7cf6"/>
      <stop offset="1" stop-color="#0b50d0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#바탕)"/>
  <!-- 방패 — 위는 각지고 아래는 뾰족하게 모이는 표준 형태. 흰색으로 꽉
       채워야 48px 로 줄여도 형태가 살아남습니다(선으로 그리면 뭉갭니다). -->
  <path d="M256 92 L402 146 V264 C402 342 334 402 256 428 C178 402 110 342 110 264 V146 Z"
        fill="#ffffff"/>
  <!-- 사고지점 표시 — 방패 안을 파랑으로 파냅니다. 지도의 사고지점 마커와
       같은 구성(가운데 점 + 둘레 원)입니다. -->
  <circle cx="256" cy="252" r="82" fill="none" stroke="#0b50d0" stroke-width="22"/>
  <circle cx="256" cy="252" r="26" fill="#0b50d0"/>
</svg>
