<!-- ═══════════════════════════════════════════════════════════════
     바탕화면 아이콘 원본 — build/make_icons.mjs 가 이 그림을 PNG 로 굽습니다.

     ── 지금 그림이 뜻하는 것 ──────────────────────────────────
     어두운 바탕 위의 **노란 방패**, 그 안에
       · 위 — **사고지점 표시**(둘레 원 + 가운데 점). 이 도구가 지도에
         실제로 그리는 것입니다(사고지점과 참고 반경). 도구를 열어 본
         사람은 아이콘과 화면이 같은 것을 가리킨다는 것을 알아봅니다.
       · 아래 — **안전표지의 사선**(노랑·검정 빗금). 현장에서 "여기는
         안전 구역/주의 구역"을 알리는 그 표시입니다.
     경고가 아니라 **대응**을 뜻하는 그림입니다.

     ⚠ **사선은 아래쪽 띠 안에만 넣습니다.** 방패 전체에 깔면
       사선이 방패를 가로질러 **형태를 잘라 놓아** 48px 로 줄였을 때
       방패로 안 읽힙니다. 아래쪽 띠에만 넣고 방패의 뾰족한 끝은
       노랑으로 남깁니다.

     ── 왜 마스크로 파내나 ─────────────────────────────────────
     원·점·사선을 어두운 색으로 **그려서 덮으면** 바탕의 그라데이션과
     미묘하게 어긋납니다. `파냄` 마스크로 방패에서 도려내 **바탕이 그대로
     비치게** 했습니다.

     ── 왜 경고 삼각형이 아닌가 ────────────────────────────────
     처음에는 경고 삼각형(!)이었습니다. 사용자가 "오류 마크 같아서 불편한
     느낌"이라고 했고, 실제로 그 모양은 어느 화면에서나 **오류·경고**로
     읽힙니다. 바탕화면에 늘 놓고 보는 아이콘이 "무언가 잘못됐다"고
     말하고 있으면 안 됩니다.

     ── 색 ────────────────────────────────────────────────────
     바탕 #262b35 → #14161c(어두운 남회색) · 방패 #ffcc01.
     2026-09-16 사용자가 다섯 안 가운데 이것을 골랐습니다.
     ⚠ **화면 안에서는 이 노랑을 쓰지 않습니다.** 도구 화면의 색은 KRDS
       토큰만 씁니다(빨강 = 실제 위험 · 초록 = 대피장소). 아이콘은 바탕화면
       에서 혼자 서 있는 그림이라 따로 정한 것입니다.

     ── 넣지 않은 것 ──────────────────────────────────────────
     · 정부상징(태극) — 기관의 공식 표장을 아이콘에 넣는 것은 "공식 앱"
       이라는 주장이라 기관 승인이 필요합니다.
     · GHS 그림문자(마름모) — 법으로 뜻이 정해진 표지라, 도구 아이콘으로
       쓰면 없는 뜻을 주장하게 됩니다.
     바꾸려면 이 파일을 고치고 `node build/make_icons.mjs`.
     **탭 아이콘(`<link rel="icon" href="data:image/svg+xml,…">`)도 그
     스크립트가 이 파일에서 만들어 HTML 에 적어 넣습니다** — 예전에는
     손으로 옮겨 적어야 해서 둘이 달라질 수 있었습니다(그림이 주소 안에
     통째로 적혀 있어 이 파일을 보지 않기 때문). 이제 한 곳만 고치면 됩니다.

     ── 안전 영역 ──────────────────────────────────────────────
     512 기준 가운데 지름 410(80%) 안에 그림이 들어가야 합니다. 안드로이드가
     기기마다 다른 모양(원·둥근사각)으로 잘라내기 때문입니다(maskable).
     방패는 가로 292 · 세로 336 으로 그 안에 들어 있습니다.
     ═══════════════════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="바탕" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262b35"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <!-- 흰 곳만 남습니다 — 방패를 그리고 그 위에 검정으로 도려냅니다. -->
    <mask id="파냄">
      <rect width="512" height="512" fill="#000"/>
      <path d="M256 92 L402 146 V264 C402 342 334 402 256 428 C178 402 110 342 110 264 V146 Z"
            fill="#fff"/>
      <!-- 사고지점 표시 — 지도의 마커와 같은 구성(둘레 원 + 가운데 점) -->
      <circle cx="256" cy="218" r="66" fill="none" stroke="#000" stroke-width="26"/>
      <circle cx="256" cy="218" r="27" fill="#000"/>
      <!-- 안전표지 사선 — 아래에서 위로 오른쪽으로 기웁니다(‘/’ 방향).
           꼭짓점이 y=380·310 으로 **평행사변형 자체가 띠 높이**입니다 —
           따로 잘라내지 않습니다. 방패 밖으로 나간 부분은 마스크가
           어차피 지웁니다. -->
      <g fill="#000">
        <path d="M16 380 h44 l58 -70 h-44 Z"/>
        <path d="M104 380 h44 l58 -70 h-44 Z"/>
        <path d="M192 380 h44 l58 -70 h-44 Z"/>
        <path d="M280 380 h44 l58 -70 h-44 Z"/>
        <path d="M368 380 h44 l58 -70 h-44 Z"/>
        <path d="M456 380 h44 l58 -70 h-44 Z"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#바탕)"/>
  <rect width="512" height="512" fill="#ffcc01" mask="url(#파냄)"/>
</svg>
