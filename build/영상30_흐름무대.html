<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>결선 영상 무대 — 사고 하나 흐름 판</title>
<!--
  결선 발표용 「사고 하나 흐름 판」의 한 장면 한 장면을 그리는 무대입니다
  (build/make_short_video_flow.mjs 의 `엮기` 가 엶).
  · 무엇을 그릴지는 만드는 스크립트가 시각마다 계산해 넘깁니다(`장면(상태)`).
    여기는 받은 대로 그리기만 합니다 — 시각 계산이 두 곳에 나뉘면 타이머와 화면이 어긋납니다.
  · 휴대전화 안은 실제 서비스를 녹화한 화면입니다. 여기서는 테두리 · 자막 · 타이머 ·
    누름 자국 · 확대만 얹습니다.
  · 차림은 앞의 두 판과 같게 — 검정 바탕 · 주황 이름표 · 금색 마무리 글.
  · 자막은 한 화면에 한 문장, 크게(요청문). 나레이션이 없어 자막이 설명을 대신합니다.
-->
<style>
@font-face { font-family: 'PGOV'; src: url('../assets/fonts/PretendardGOV-Regular.subset.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'PGOV'; src: url('../assets/fonts/PretendardGOV-Bold.subset.woff2') format('woff2'); font-weight: 700; }
:root { --or: #E7A23D; --gold: #FFC20E; --gray: #A9AFBA; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07080A; }
body { font-family: 'PGOV', sans-serif; color: #fff; word-break: keep-all; }
.abs { position: absolute; }
#bg { left: 0; top: 0; width: 1920px; height: 1080px; background: radial-gradient(ellipse 1400px 1000px at 65% 50%, #151A25 0%, #07080A 70%); }

/* 왼쪽 — 이름표 · 자막 */
#lbl { left: 120px; top: 300px; font-size: 34px; font-weight: 700; color: var(--or); letter-spacing: 1px; }
#cap { left: 120px; top: 356px; width: 900px; font-size: 92px; font-weight: 700; line-height: 1.2; letter-spacing: -2px; white-space: pre-line; }
#sub { left: 120px; top: 520px; font-size: 38px; font-weight: 700; color: #111; background: var(--or); border-radius: 12px; padding: 12px 24px; }
#cap.end { color: var(--gold); font-size: 84px; }

/* QR — 여는 장면과 마무리 */
#qr { left: 120px; top: 640px; width: 300px; height: 300px; background: #fff; border-radius: 22px; padding: 18px; box-sizing: border-box; overflow: hidden; }
#qr img { width: 100%; height: 100%; display: block; }
#scan { left: 0; width: 100%; height: 6px; background: var(--or); box-shadow: 0 0 22px 6px rgba(231,162,61,.55); }
#url { left: 460px; top: 760px; font-size: 40px; font-weight: 700; color: #fff; }
#url small { display: block; font-size: 26px; font-weight: 400; color: var(--gray); margin-top: 10px; }
#vir { left: 120px; top: 1002px; font-size: 24px; color: #8A909A; }

/* 휴대전화 */
#phone { left: 1090px; top: 44px; width: 470px; height: 964px; border: 14px solid #23262D; border-radius: 60px; overflow: hidden; background: #fff;
  box-shadow: 0 0 0 2px #3A3E47, 0 30px 90px rgba(0,0,0,.7), 0 0 120px rgba(231,162,61,.16); }
#scr { position: absolute; left: 0; top: 0; width: 470px; height: 964px; display: block; transform-origin: 0 0; }
#taps { position: absolute; left: 0; top: 0; width: 470px; height: 964px; pointer-events: none; transform-origin: 0 0; }
#lens { left: 120px; top: 620px; overflow: hidden; border-radius: 16px; background: #fff; border: 4px solid var(--or);
  box-shadow: 0 20px 60px rgba(0,0,0,.6); opacity: 0; }
#lens img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#mark { position: absolute; border: 3px solid var(--or); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,.18); opacity: 0; pointer-events: none; }
.tap { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 4px solid var(--or); box-sizing: border-box; background: rgba(231,162,61,.35); }
#back { left: 1110px; top: 930px; font-size: 26px; font-weight: 700; color: #111; background: #fff; border-radius: 999px; padding: 8px 22px; box-shadow: 0 6px 20px rgba(0,0,0,.4); opacity: 0; }

/* 오른쪽 위 — 경과 시간 */
#tm { left: 1620px; top: 60px; width: 260px; text-align: right; }
#tm .k { font-size: 24px; color: var(--gray); font-weight: 700; }
#tm .v { font-size: 76px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1.05; margin-top: 6px; }
#tm .n { font-size: 20px; color: #8A909A; margin-top: 4px; }
#spd { display: inline-block; margin-top: 16px; font-size: 24px; font-weight: 700; color: #111; background: var(--or); border-radius: 999px; padding: 6px 18px; }

#fade { left: 0; top: 0; width: 1920px; height: 1080px; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="bg" class="abs"></div>
<div id="lbl" class="abs"></div>
<div id="cap" class="abs"></div>
<div id="sub" class="abs"></div>
<div id="qr" class="abs"><img id="qri" alt=""><div id="scan" class="abs"></div></div>
<div id="url" class="abs">chem-safety-kr.pages.dev<small>화학사고 초동대응 지원 서비스</small></div>
<div id="vir" class="abs">가상 상황 시연 · 여수시 주삼동 사업장 암모니아 누출</div>
<div id="phone" class="abs"><img id="scr" alt=""><div id="taps"></div><div id="mark"></div></div>
<div id="lens" class="abs"><img id="lensi" alt=""></div>
<div id="back" class="abs">← 뒤로</div>
<div id="tm" class="abs"><div class="k">경과 시간</div><div class="v" id="tmv">0:00.0</div><div class="n">자동 시연 기준</div><span id="spd"></span></div>
<div id="fade" class="abs"></div>
<script>
function $(s) { return document.querySelector(s); }
var 배율 = 1;                                  // 휴대전화 css px → 무대 px

window.준비 = function (o) {
  배율 = 470 / o.폭;
  $('#qri').src = o.qr;
  return Promise.all([$('#qri').decode().catch(function () {}), document.fonts.ready]);
};

function 시계(s) {
  // 10분의 1초로 먼저 반올림한 뒤 나눔 — 9.96초가 '010.0' 으로 찍히지 않게
  var d = Math.round(s * 10), m = Math.floor(d / 600), r = d - m * 600;
  return m + ':' + (r < 100 ? '0' : '') + (r / 10).toFixed(1);
}

window.장면 = function (s) {
  // 자막 — 바뀔 때 살짝 올라오며 나타남
  $('#cap').textContent = s.자막;
  $('#cap').className = 'abs' + (s.자막끝 ? ' end' : '');
  $('#cap').style.opacity = s.자막보임;
  $('#cap').style.transform = 'translateY(' + (24 * (1 - s.자막보임)) + 'px)';
  $('#sub').textContent = s.덧글;
  $('#sub').style.opacity = s.덧글보임;
  $('#sub').style.visibility = s.덧글 ? 'visible' : 'hidden';
  $('#lbl').textContent = s.이름표;
  $('#lbl').style.opacity = s.이름표 ? s.자막보임 : 0;

  // QR — 여는 장면(휴대전화가 열리기 전)과 마무리에서만
  var 여는 = s.t < 4;
  var qr보임 = 여는 ? 1 - Math.max(0, (s.t - 3.4) / 0.6) : s.끝;
  $('#qr').style.opacity = qr보임;
  $('#scan').style.top = (s.스캔 * 100) + '%';
  $('#scan').style.opacity = s.스캔 < 1 ? 1 : 0;
  $('#url').style.opacity = s.끝;
  $('#vir').style.fontSize = (여는 ? 28 : 22) + 'px';
  $('#vir').style.top = (여는 ? 990 : 1012) + 'px';

  // 휴대전화 — 녹화 화면 · 확대 · 누름 자국
  var scr = $('#scr');
  if (s.폰 && scr.getAttribute('src') !== s.폰) scr.setAttribute('src', s.폰);
  $('#phone').style.opacity = s.폰 ? s.폰보임 : 0;
  $('#phone').style.transform = 'translateY(' + (60 * (1 - (s.폰 ? s.폰보임 : 0))) + 'px)';
  // 돋보기 — 지금 휴대전화 화면에서 그 자리만 잘라 자막 아래에 크게
  var lens = $('#lens'), mk = $('#mark');
  if (s.돋 && s.폰) {
    var z = s.돋, 여 = 6;
    var x0 = Math.max(0, z.x - 여), y0 = Math.max(0, z.y - 여), w = z.w + 여 * 2, h = z.h + 여 * 2;
    var 위 = $('#cap').offsetTop + $('#cap').offsetHeight + (s.덧글 ? 120 : 44);
    var k = Math.min(2.4, 880 / w, (1000 - 위) / h);   // css px → 무대 px
    lens.style.top = 위 + 'px';
    lens.style.width = (w * k) + 'px'; lens.style.height = (h * k) + 'px';
    var li = $('#lensi');
    if (li.getAttribute('src') !== s.폰) li.setAttribute('src', s.폰);
    li.style.width = (470 / 배율 * k) + 'px'; li.style.height = (964 / 배율 * k) + 'px';
    li.style.left = (-x0 * k) + 'px'; li.style.top = (-y0 * k) + 'px';
    lens.style.opacity = z.a;
    lens.style.transform = 'translateY(' + (20 * (1 - z.a)) + 'px)';
    mk.style.left = (x0 * 배율) + 'px'; mk.style.top = (y0 * 배율) + 'px';
    mk.style.width = (w * 배율) + 'px'; mk.style.height = (h * 배율) + 'px';
    mk.style.opacity = z.a;
  } else { lens.style.opacity = 0; mk.style.opacity = 0; }
  $('#taps').innerHTML = s.누름.map(function (m) {
    var 크기 = 1 + 2.2 * m.a;
    return '<div class="tap" style="left:' + (m.x * 배율) + 'px;top:' + (m.y * 배율) + 'px;transform:scale(' + 크기 + ');opacity:' + (1 - m.a) + '"></div>';
  }).join('');
  $('#back').style.opacity = s.뒤로 ? 1 : 0;

  // 경과 시간 — 녹화된 그 장면의 실제 시각
  $('#tmv').textContent = 시계(s.경과);
  $('#tm .k').textContent = s.자막끝 ? '전체 경과 시간' : '경과 시간';
  var 빠름 = s.배 >= 1.15;
  $('#spd').textContent = 빠름 ? s.배.toFixed(1) + '배 빠르게' : '';
  $('#spd').style.visibility = 빠름 ? 'visible' : 'hidden';

  $('#fade').style.opacity = s.어둡게 + (s.t < 0.15 ? 1 - s.t / 0.15 : 0);
  var 다 = [];
  if (scr.getAttribute('src')) 다.push(scr.decode().catch(function () {}));
  if (s.돋 && $('#lensi').getAttribute('src')) 다.push($('#lensi').decode().catch(function () {}));
  return Promise.all(다);
};
</script>
</body>
</html>
