  왜 이렇게 짰나 (2026-11-20 사용자 — "첫화면에 4가지 도구가 보이고 거기서 한개씩
  줌인 되듯이 들어가서 각 도구를 설명하는 방식"):

  · 한 도구는 6초(120 BPM 의 세 마디)입니다 —
      들어가기 0.5초(앞 도구 끝에 붙음) → 제목 0.75초 → 시연 3.5초
      → 나오기 0.5초 → 첫 화면에서 다음 카드 짚기·누르기 0.75초.
    마디 첫 박(4·10·16·22초)마다 음악의 큰 북과 함께 제목이 뜹니다
    (build/make_short_music_zoom.py 와 같은 시각 — 한쪽만 바꾸지 마세요).
  · 들어갈 때 카드 사진을 그대로 키우면 첫 화면 사진의 화소가 모자라 뭉개집니다.
    그래서 카메라가 카드로 빨려 들어가는 동안 흐림을 키우고, 큰 북 자리에서
    **원본 사진**(source/photos)으로 갈아 끼웁니다(흔히 쓰는 '빨려 들기' 넘김).
  · 시간 t 를 받아 그 순간의 모습을 계산해 그립니다 — CSS 애니메이션에 맡기면
    찍는 속도에 따라 장면이 밀려 큰 북과 화면 넘김이 어긋납니다.
  · 차림은 첫 판·최종 발표 자료(’26.9.22.)와 같게 — 검정 바탕 · 주황 번호 · 금색 제목.
  · 화면 글은 첫 판에서 쓴 문장 그대로입니다(새 주장을 얹지 않음 · CLAUDE.md 2절 5항).
  · 「판 2」(2026-11-22 사용자 — "각 카드별 설명이 … 한 2줄 정도로" · "상황실로 바로 전화를

    두 줄)과 `돋`(03 의 상황실 줄 확대 · 누름)을 넘기면 그것을 그립니다. 안 넘기면 첫 줌인 판
    그대로입니다 — 두 판이 같은 무대 · 같은 시각 · 같은 음악을 씁니다.
-->
