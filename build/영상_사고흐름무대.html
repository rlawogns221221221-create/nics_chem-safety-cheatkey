<title>결선 영상 무대 — 사고 흐름 판 3</title>
<!--
  결선 발표용 「사고 흐름 판 3」(영상 46초 · 시계는 2분 57초에서 멈춤)의 한 장면 한 장면을 그리는 무대입니다
  (build/make_flow_video_long.mjs 의 `엮기` 가 엶). 36초 흐름 판의 무대(영상30_흐름무대.html)는 그대로 둡니다.
  · **첫 장면 = 접속 화면**(2026-11-23 저녁 사용자 — "인트로 사진이 내가 원하던 건 … 수정1 화면이야. 그냥 저
    화면에서 QR 코드만 선명하게 보이도록, 다른 부가설명은 필요 없어"). 0초에 왼쪽 위 작은 사고 카드 · 「설치·회원가입
    없이 QR 하나로 접속」 · **흰 바탕 QR(흐림·스캔 줄 없음)** · 휴대전화 첫 화면 · 시계 0:00.0 이 다 떠 있습니다.
    PPT 에 넣으면 재생 전 이 화면이 보입니다. 2판의 번호 단 화면 구성(첫 장)은 걷어냈습니다.
  · 재생하면 작은 사고 카드가 가운데로 **커졌다가**(나머지는 잠깐 물러남 · 「수정2」 장면) 다시 왼쪽 위로 갑니다.
    붉은 딱지에 「가상 상황 · 실제 사고가 아닙니다」 를 늘 함께 둡니다.
  · 시계가 2분 57초에서 멈춘 뒤 **마무리 1.3초**(금색 끝 자막 · QR · 주소)가 떠오르고 그 화면으로 끝납니다 —
    어둡게 사라지지 않습니다(사용자 — "마무리 장면 1.3초 정도 … 페이드아웃 없이 영상이 종료되도록").
  · 무엇을 그릴지는 만드는 스크립트가 시각마다 계산해 넘깁니다(`장면(상태)`). 여기는 받은 대로
    그리기만 합니다 — 시각 계산이 두 곳에 나뉘면 타이머와 화면이 어긋납니다.
  · 휴대전화 안은 실제 서비스를 녹화한 화면입니다. 여기서는 테두리 · 자막 · 타이머 · 누름 자국 ·
    확대(돋보기)만 얹습니다. 상황실 줄은 누르지 않아 전화 표시를 그리지 않습니다(사용자 — "보이기만").
  · 차림은 앞의 판들과 같게 — 검정 바탕 · 주황 이름표. 사고는 붉은색으로만.
-->
<style>
@font-face { font-family: 'PGOV'; src: url('../assets/fonts/PretendardGOV-Regular.subset.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'PGOV'; src: url('../assets/fonts/PretendardGOV-Bold.subset.woff2') format('woff2'); font-weight: 700; }

  background: radial-gradient(ellipse 1100px 800px at 26% 52%, rgba(224,50,42,.34) 0%, rgba(224,50,42,0) 70%); }

/* 가상 사고 카드 — 크게(처음) ↔ 작게(왼쪽 위). 통째로 줄이면(scale) 작아진 뒤 사업장·물질 줄이
   30px 안팎이 되어(사용자 — "글씨가 잘 보이게") 글자 크기를 따로 오가게 했습니다. */
#acc { left: 120px; top: 0; padding: var(--pv) var(--ph) calc(var(--pv) + 4px) var(--ph); border-radius: 20px;
  background: rgba(224,50,42,.12); border: 3px solid rgba(224,50,42,.55); border-left: 14px solid var(--red);
  box-shadow: 0 20px 60px rgba(0,0,0,.45); white-space: nowrap;
  --tf: 40px; --hf: 124px; --lf: 62px; --pv: 34px; --ph: 48px; --dot: 58px; --gap: 22px; }
#acc .tag { display: inline-block; font-size: var(--tf); font-weight: 700; color: #fff; background: var(--red);
  border-radius: 10px; padding: .2em .55em; letter-spacing: -.5px; }
#acc .h { display: flex; align-items: center; gap: .26em; font-size: var(--hf); font-weight: 700; margin-top: var(--gap); letter-spacing: -.03em; line-height: 1.1; }
#acc .dot { position: relative; width: var(--dot); height: var(--dot); flex: none; }
#acc .dot i { position: absolute; inset: 0; border-radius: 50%; background: var(--red); }

#acc .ln b { color: #FF8A80; }

/* 왼쪽 — 이름표 · 자막 · 덧글 */
#lbl { left: 120px; top: 318px; font-size: 34px; font-weight: 700; color: var(--or); letter-spacing: 1px; }
#cap { left: 120px; top: 366px; width: 920px; font-size: 84px; font-weight: 700; line-height: 1.2; letter-spacing: -2px; white-space: pre-line; }
#cap.end { color: var(--gold); font-size: 74px; width: 960px; }
/* 한 줄 자막 — 그 아래 확대(협의업체 줄 통째)를 크게 둘 자리를 냄 */
#cap.one { font-size: 64px; letter-spacing: -1.5px; }
#sub { left: 120px; top: 600px; font-size: 36px; font-weight: 700; color: #111; background: var(--or); border-radius: 12px; padding: 10px 22px; }

/* QR — 접속하는 장면과 마무리 */
/* 3판 — 첫 장면에서 휴대전화로 바로 읽히게 조금 키움(340px · 흰 바탕 · 흐림·스캔 줄 없음) */
#qr { left: 120px; top: 640px; width: 340px; height: 340px; background: #fff; border-radius: 22px; padding: 20px; box-sizing: border-box; overflow: hidden; }
#qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
/* QR 이 340px 로 커져 오른쪽 끝이 460px — 주소는 그 옆으로 40px 띄움 */
#url { left: 500px; top: 760px; font-size: 40px; font-weight: 700; color: #fff; }
#url small { display: block; font-size: 26px; font-weight: 400; color: var(--gray); margin-top: 10px; }
#vir { left: 120px; top: 1018px; font-size: 24px; color: #9AA0AA; }

/* 휴대전화 */
#phone { left: 1090px; top: 44px; width: 470px; height: 964px; border: 14px solid #23262D; border-radius: 60px; overflow: hidden; background: #fff;
  box-shadow: 0 0 0 2px #3A3E47, 0 30px 90px rgba(0,0,0,.7), 0 0 120px rgba(231,162,61,.16); }
#scr { position: absolute; left: 0; top: 0; width: 470px; height: 964px; display: block; }
#taps { position: absolute; left: 0; top: 0; width: 470px; height: 964px; pointer-events: none; }
#mark { position: absolute; border: 3px solid var(--or); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,.2); opacity: 0; pointer-events: none; }
.tap { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 4px solid var(--or); box-sizing: border-box; background: rgba(231,162,61,.35); }
#back { left: 1110px; top: 930px; font-size: 26px; font-weight: 700; color: #111; background: #fff; border-radius: 999px; padding: 8px 22px; box-shadow: 0 6px 20px rgba(0,0,0,.4); opacity: 0; }

/* 돋보기 — 휴대전화 속 작은 글씨를 자막 아래에 크게 */
#lens { left: 120px; top: 700px; overflow: hidden; border-radius: 16px; background: #fff; border: 4px solid var(--or);
  box-shadow: 0 20px 60px rgba(0,0,0,.6); opacity: 0; }
#lens img { position: absolute; left: 0; top: 0; }
#ltap { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 5px solid var(--or);
  box-sizing: border-box; background: rgba(231,162,61,.35); opacity: 0; }

/* 오른쪽 위 — 경과 시간 */
#tm { left: 1620px; top: 60px; width: 260px; text-align: right; }
#tm .k { font-size: 24px; color: var(--gray); font-weight: 700; }
#tm .v { font-size: 76px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1.05; margin-top: 6px; }
#tm .n { font-size: 20px; color: #8A909A; margin-top: 4px; }
#spd { display: inline-block; margin-top: 16px; font-size: 24px; font-weight: 700; color: #111; background: var(--or); border-radius: 999px; padding: 6px 18px; }

#flash { left: 0; top: 0; width: 1920px; height: 1080px; background: #fff; opacity: 0; }
#fade { left: 0; top: 0; width: 1920px; height: 1080px; background: #000; opacity: 0; }
</style>

<div id="vir" class="abs">시연을 위한 가상 상황입니다 · 업체명과 업체 전화번호는 가렸습니다</div>

<script>
function $(s) { return document.querySelector(s); }
var 배율 = 1;                                  // 휴대전화 css px → 무대 px
var 폰w = 470, 폰h = 964;
// 가상 사고 장면의 시각 — 만드는 스크립트가 넘김. 키움부터 커지고, 제목 때 맥박이 뛰고, 줄임부터 왼쪽 위로
var 때 = { 키움: 0.8, 키움길이: 0.6, 제목: 1.4, 줄임: 3.4, 줄임길이: 0.6 };
function clamp(x) { return Math.max(0, Math.min(1, x)); }
function 쉬움(x) { x = clamp(x); return 1 - Math.pow(1 - x, 3); }
function 둘다(x) { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function 사이(t, a, d) { return clamp((t - a) / d); }
function lerp(a, b, x) { return a + (b - a) * x; }
function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

window.준비 = function (o) {
  배율 = 폰w / o.폭;
  if (o.때) 때 = o.때;
  $('#qri').src = o.qr;
  var a = o.사고;
  $('#acc1').innerHTML = '<b>' + esc(a.시각) + '</b>&nbsp;&nbsp;' + esc(a.곳);
  $('#acc2').innerHTML = esc(a.사업장) + ' 사업장 · <b>' + esc(a.물질) + ' 누출</b>';
  return Promise.all([$('#qri').decode().catch(function () {}), document.fonts.ready]);
};

function 시계(s) {
  // 10분의 1초로 먼저 반올림한 뒤 나눔 — 9.96초가 '010.0' 으로 찍히지 않게
  var d = Math.round(s * 10), m = Math.floor(d / 600), r = d - m * 600;
  return m + ':' + (r < 100 ? '0' : '') + (r / 10).toFixed(1);
}

window.장면 = function (s) {
  var t = s.t;

  // ── 가상 사고 카드 — 처음엔 왼쪽 위에 작게(접속 화면) → 재생하면 가운데로 크게 → 다시 왼쪽 위로 ──
  var acc = $('#acc');
  var 작게 = t < 때.줄임 ? 1 - 둘다(사이(t, 때.키움, 때.키움길이)) : 둘다(사이(t, 때.줄임, 때.줄임길이));
  var 크기 = { tf: [40, 26], hf: [124, 56], lf: [62, 40], pv: [34, 18], ph: [48, 28], dot: [58, 30], gap: [22, 10] };
  Object.keys(크기).forEach(function (k) { acc.style.setProperty('--' + k, lerp(크기[k][0], 크기[k][1], 작게) + 'px'); });
  var 큰top = 540 - acc.offsetHeight / 2 - 10;
  acc.style.transform = 'translate(0px,' + lerp(큰top, 36, 작게) + 'px)';
  // 이름표·자막은 작은 카드 바로 아래부터(카드 높이를 숫자로 못 박지 않음 · 카드가 커져 있는 동안은 물러나 있음)
  var 작은높이 = acc.offsetHeight;
  if (작게 < 1) {                                 // 카드가 커진 동안에도 자막 자리는 작은 카드 기준으로 그대로
    Object.keys(크기).forEach(function (k) { acc.style.setProperty('--' + k, 크기[k][1] + 'px'); });
    작은높이 = acc.offsetHeight;
    Object.keys(크기).forEach(function (k) { acc.style.setProperty('--' + k, lerp(크기[k][0], 크기[k][1], 작게) + 'px'); });
  }
  var 카드아래 = 36 + 작은높이;
  $('#lbl').style.top = (카드아래 + 30) + 'px';
  $('#cap').style.top = (카드아래 + 78) + 'px';
  acc.style.opacity = 1;
  // 붉은 점 — 퍼지는 고리. 커져 있는 동안 빠르게, 작아진 뒤에는 천천히(첫 장면에서는 고리 없이 깔끔하게)
  var 주기 = t < 때.줄임 ? 0.9 : 2.2;
  [].forEach.call(acc.querySelectorAll('.dot u'), function (u, j) {
    var p = (t - 때.제목 - j * 주기 / 2) / 주기;
    p = p < 0 ? -1 : p - Math.floor(p);
    u.style.opacity = p < 0 ? 0 : 0.85 * (1 - p);
    u.style.transform = 'scale(' + (1 + 1.4 * p) + ')';
  });
  // 바탕의 붉은 기운 — 카드가 커질 때 맥박 두세 번, 줄어든 뒤에는 거의 꺼짐
  var 맥 = t < 때.제목 ? 0 : 0.55 + 0.45 * Math.cos(2 * Math.PI * (t - 때.제목) / 1.1);
  var 꺼짐 = 때.줄임 + 0.6;
  $('#alarm').style.opacity = 쉬움(사이(t, 때.제목, 0.3)) * (t < 꺼짐 ? 0.35 + 0.65 * 맥 : 0.12 * (1 - 쉬움(사이(t, 꺼짐, 1.5))));
  // 카드가 커져 있는 동안 나머지(자막 · QR · 휴대전화 · 시계)는 물러나 있음 — 「수정2」 장면은 카드만
  // 돌아오는 것은 카드가 거의 다 줄어든 뒤 — 일찍 돌아오면 줄어드는 카드 밑에 자막이 겹쳐 보였습니다
  var 바깥 = t < 때.줄임 ? 1 - 쉬움(사이(t, 때.키움, 0.35)) : 쉬움(사이(t, 때.줄임 + 때.줄임길이 - 0.15, 0.3));

  // ── 자막 — 바뀔 때 살짝 올라오며 나타남 ──
  var cap = $('#cap');
  cap.textContent = s.자막;
  cap.className = 'abs' + (s.자막끝 ? ' end' : '') + (s.한줄 ? ' one' : '');
  cap.style.opacity = s.자막보임 * 바깥;
  cap.style.transform = 'translateY(' + (24 * (1 - s.자막보임)) + 'px)';
  $('#lbl').textContent = s.이름표;
  $('#lbl').style.opacity = s.이름표 ? s.자막보임 * 바깥 : 0;
  var 덧 = $('#sub');
  덧.textContent = s.덧글;
  덧.style.visibility = s.덧글 ? 'visible' : 'hidden';
  덧.style.opacity = 쉬움((s.자막보임 - 0.4) / 0.6) * 바깥;
  덧.style.top = (cap.offsetTop + cap.offsetHeight + 22) + 'px';

  // ── QR — 첫 장면(접속 화면)부터 01 이 시작할 때까지, 그리고 마무리. 흐림·반투명 없이 흰 바탕 그대로(읽히게) ──
  $('#qr').style.opacity = Math.max(바깥 * (1 - 쉬움(사이(t, s.qr끝 - 0.1, 0.5))), s.끝 || 0);
  $('#url').style.opacity = s.끝 || 0;

  // ── 휴대전화 — 녹화 화면 · 누름 자국 ──
  var scr = $('#scr');
  if (s.폰 && scr.getAttribute('src') !== s.폰) scr.setAttribute('src', s.폰);
  var 폰 = s.폰 ? 바깥 : 0;
  $('#phone').style.opacity = 폰;
  $('#phone').style.transform = 'translateY(' + (30 * (1 - 폰)) + 'px)';
  $('#taps').innerHTML = s.누름.map(function (m) {
    var 크기 = 1 + 2.2 * m.a;
    return '<div class="tap" style="left:' + (m.x * 배율) + 'px;top:' + (m.y * 배율) + 'px;transform:scale(' + 크기 + ');opacity:' + (1 - m.a) + '"></div>';
  }).join('');
  $('#back').style.opacity = s.처음으로 ? 1 : 0;

  // ── 돋보기 — 지금 휴대전화 화면에서 그 자리만 잘라 자막(덧글) 아래에 크게 ──
  var lens = $('#lens'), mk = $('#mark'), lt = $('#ltap');
  if (s.돋 && s.폰) {
    var z = s.돋, 여 = 6;
    var x0 = Math.max(0, z.x - 여), y0 = Math.max(0, z.y - 여), w = z.w + 여 * 2, h = z.h + 여 * 2;
    var 아래 = s.덧글 ? 덧.offsetTop + 덧.offsetHeight : cap.offsetTop + cap.offsetHeight;
    var 위 = 아래 + 40;
    // 크게(협의업체 줄 통째) — 자막을 한 줄로 줄이고 남은 높이를 다 씀(아래 가상 상황 안내 줄 앞까지)
    var k = z.크게 ? Math.min(2.6, 900 / w, (1005 - 위) / h) : Math.min(2.4, 900 / w, (1000 - 위) / h);
