  · **가상 사고 카드**(2026-11-23 사용자 — "사고 사업장이나 이런걸 좀 글씨가 잘 보이게 … 사고를 가정한
    것이라는 것이 좀 눈에 보여야"): 처음에 화면 가운데 크게 뜨고, 접속하기 전에 왼쪽 위로 줄어들어
    끝까지 그 자리에 있습니다. 붉은 딱지에 「가상 상황 · 실제 사고가 아닙니다」 를 늘 함께 둡니다.

    확대(돋보기) · 상황실 전화 표시만 얹습니다. 전화가 걸린 뒤의 화면은 기기마다 달라 그리지 않습니다.
  · 차림은 앞의 판들과 같게 — 검정 바탕 · 주황 이름표 · 금색 마무리 글. 사고는 붉은색으로만.
