<!DOCTYPE html>
<!-- ────────────────────────────────────────────────────────────
     화학사고 지자체 대응 지원도구 — 오프라인 단일 파일
     · 이 파일 하나만 있으면 인터넷 연결 없이 동작합니다.
     · 외부 서버로 어떤 정보도 전송하지 않습니다.
     · 자료 갱신은 소스 저장소에서 재빌드하세요.
       (build/make_data.py · build/make_resources.py → build/build_single.py)
     ──────────────────────────────────────────────────────────── -->

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화학사고 방제자원 동원</title>
<style>
/* 화학사고 지자체 대응 지원도구 — 공통 스타일
   재난 상황에서 쓰는 도구이므로 밝고 대비가 높은 화면 하나로만 고정합니다.
   (시스템 다크모드를 따라가지 않습니다 — 어두운 화면은 급할 때 판독성이 떨어집니다.) */

:root{
  color-scheme: light;
  --bg:#eef1f5; --card:#fff; --panel:#f7f9fb;
  --ink:#12181f; --ink2:#4a5563; --ink3:#78838f;
  --line:#d5dce3; --line2:#e8edf1;
  --brand:#0b57a4; --brand-d:#073f7c; --brand-l:#e6eff8;
  --ok:#0b6b41; --ok-l:#e3f4ec;
  --warn:#8a4f06; --warn-l:#fdf2e0;
  --err:#b31f1f; --err-l:#fdeaea;
  --r:10px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box}
[hidden]{display:none!important}   /* display:grid/flex 가 hidden 을 덮지 않도록 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ── 부드럽게 나타나기 ────────────────────────────────────────
   버튼을 눌러 새로 보이게 되는 요소들에 붙인다. [hidden] 을 뗄 때
   (display:none → 보임) 브라우저가 애니메이션을 처음부터 다시 재생하므로,
   자바스크립트로 시점을 맞출 필요 없이 CSS만으로 "누르면 부드럽게 나타남"이
   된다. innerHTML 로 새로 그려지는 요소(문안 카드 등)에도 그대로 적용되며,
   이 경우는 새로 생겨날 때마다 매번 재생된다. */
@keyframes revealIn{
  from{opacity:0;transform:translateY(9px)}
  to{opacity:1;transform:none}
}
/* 위로 살짝 밀려 올라오며 나타남 — 트리거 아래에서 위로 열리는 것(문자 생성칸)에 */
@keyframes slideUp{
  from{opacity:0;transform:translateY(26px)}
  to{opacity:1;transform:none}
}
/* 위에서 아래로 펼쳐지며 나타남 — 트리거 바로 아래 붙어 열리는 것(목록·추가 입력)에 */
@keyframes slideDown{
  from{opacity:0;transform:translateY(-12px)}
  to{opacity:1;transform:none}
}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",
              -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.6; word-break:keep-all;
  display:flex;flex-direction:column;min-height:100vh;
}
@supports (min-height:100dvh){ body{min-height:100dvh} }
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 64px}

/* ── 헤더 ─────────────────────────────────────────── */
.top{background:var(--brand-d);color:#fff;padding:13px 0}
.top .wrap{padding-bottom:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:200px}
.top .sub{font-size:12.5px;color:#bcd3ec;font-weight:400}
.top .act{display:flex;gap:8px}
.top button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);
            color:#fff;padding:6px 12px;font-size:13px}
.top button:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.5)}

/* 안내 띠 */
.note{background:#dbe7f4;border-bottom:1px solid #bed3e8;color:#0d3f70;
      font-size:12.5px;padding:8px 0;margin-bottom:16px}
.note .wrap{padding-bottom:0}

/* ── 발송 구분 선택 ───────────────────────────────────
   버튼을 고르기 전에는 화면에 이것 하나뿐이므로, 위에 쏠리지 않고 남는
   공간 가운데에 오도록 .stepsz 를 화면을 채우는 flex 축으로 둔다
   (.toolstage 가 body의 남는 세로 공간을 다 가져가고, 그 안에서 다시
   .stepsz 가 가운데 정렬). 구분을 고르면(body.has-stage) 문자 생성칸이
   보여야 하므로 이 자리는 작은 띠로 접힌다 — 정사각형 그대로 두면 화면을
   너무 많이 차지해 아래 내용이 밀려나기 때문. 카드 자체 크기(패딩·아이콘·
   설명 줄)를 전환시켜 접고 펼치므로 방향 전환 없이 부드럽게 줄어든다. */
/* ‼ 줄어드는 애니메이션이 실제로 "보이려면" 두 상태 모두 구체적인 길이 값이어야
   한다 — aspect-ratio:auto 나 flex-basis:auto 처럼 한쪽이 auto/none 인 값은
   브라우저가 중간값을 보간하지 못해 트랜지션이 순간적으로 툭 끊겨 버린다
   (실제로 그랬음). 그래서 아래에서는 정사각형도 aspect-ratio 대신 height 를
   구체적인 값(clamp)으로 직접 주고, .stepsz 도 flex-basis 는 0 으로 고정한 채
   flex-grow 숫자만 1↔0 으로 바꾼다. */
.toolstage{flex:1;display:flex;flex-direction:column;min-height:0}
.stepsz{flex:1 1 0;display:flex;align-items:center;justify-content:center;
  padding:26px 0;transition:flex-grow .5s var(--ease),padding .5s var(--ease)}
body.has-stage .stepsz{flex-grow:0;padding:14px 0 10px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;
  max-width:760px;transition:max-width .5s var(--ease),gap .5s var(--ease)}
body.has-stage .steps{max-width:1180px;gap:10px}

.steps button.stp{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  text-align:center;width:100%;height:clamp(150px,20vw,210px);padding:18px 14px 16px;
  border:1.5px solid var(--line);background:var(--card);border-radius:16px;line-height:1.35;
  color:var(--ink);box-shadow:0 1px 2px rgba(18,40,70,.05);
  transition:border-color .18s var(--ease),box-shadow .3s var(--ease),
             transform .18s var(--ease),background .18s var(--ease),
             height .45s var(--ease),
             padding .4s var(--ease),border-radius .4s var(--ease),gap .4s var(--ease)}
.stp-ic{width:46px;height:46px;color:var(--brand);flex:none;
  transition:color .18s var(--ease),width .4s var(--ease),height .4s var(--ease)}
.stp-ic svg{width:100%;height:100%;display:block}
.steps button.stp b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em;
  transition:font-size .4s var(--ease)}
.stp-d{font-size:11.5px;color:var(--ink3);font-weight:500;max-height:2.4em;opacity:1;
  transition:color .18s var(--ease),max-height .35s var(--ease),opacity .25s var(--ease),
             margin .35s var(--ease)}
.steps button.stp:hover{border-color:var(--brand);box-shadow:0 8px 20px rgba(11,87,164,.15);
  transform:translateY(-2px)}
.steps button.stp:active{transform:translateY(0)}
.steps button.stp[aria-pressed=true]{border-color:var(--brand-d);background:var(--brand);
  color:#fff;box-shadow:0 8px 22px rgba(11,87,164,.3)}
.steps button.stp[aria-pressed=true] .stp-ic{color:#fff}
.steps button.stp[aria-pressed=true] .stp-d{color:#cfe0f5}

/* 구분을 고른 뒤 — 정사각형을 접어 작은 띠로. 시야를 덜 차지하도록
   아이콘·글자를 줄이고 설명 줄은 높이째 접어 사라지게 한다. */
body.has-stage .steps button.stp{height:60px;padding:8px 10px;border-radius:12px;gap:3px}
body.has-stage .stp-ic{width:22px;height:22px}
body.has-stage .steps button.stp b{font-size:12.5px}
body.has-stage .stp-d{max-height:0;opacity:0;margin-top:-3px;pointer-events:none}
body.has-stage .steps button.stp:hover{transform:none}

/* ── 2단 레이아웃 ─────────────────────────────────── */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:16px;align-items:start;
  animation:slideUp .46s var(--ease) both}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 1px 3px rgba(18,40,70,.05)}
.panel > h2{margin:0;padding:11px 16px;font-size:13px;font-weight:700;color:var(--ink2);
  border-bottom:1px solid var(--line2);letter-spacing:.01em;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel .body{padding:15px 16px}
.sticky{position:sticky;top:14px}

/* ── 폼 ───────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px 12px}
#fEvacExtra{animation:slideDown .3s var(--ease) both}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.f label .req{color:var(--err);margin-left:2px}
.f .fh{font-size:11.5px;color:var(--ink3);line-height:1.45}
input[type=text],input[type=time],select{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  background:#fff;color:var(--ink);font:inherit;font-size:14px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
select[multiple]{padding:3px;min-height:150px}
select[multiple] option{padding:5px 7px;border-radius:4px;line-height:1.35;font-size:13px}

/* 구분선이 있는 소제목 */
.sect{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.03em;
      margin:16px 0 9px;padding-top:13px;border-top:1px solid var(--line2)}
.body > .sect:first-child{margin-top:0;padding-top:0;border-top:0}

/* ── 사고정보 묶음 ─────────────────────────────────────────
   처음 보는 근무자도 위에서부터 순서대로 채우면 되도록 번호를 매겨
   묶었습니다. 다 채워야 다음이 열리는 방식은 아닙니다 — 급할 때는
   아는 값부터 순서 없이 채울 수 있어야 합니다. */
.fcommon{margin:16px 0 9px;padding-top:13px;border-top:1px solid var(--line2)}
.fgrp{margin-bottom:16px}
.fgrp:last-child{margin-bottom:0}
.fgrp-hd{display:flex;align-items:baseline;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.fgrp-n{flex:none;width:18px;height:18px;border-radius:50%;background:var(--brand);
  color:#fff;font-size:10.5px;font-weight:700;line-height:18px;text-align:center}
.fgrp-hd b{font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.01em}
.fgrp-d{font-size:11.5px;color:var(--ink3)}

/* 대상지역 — 사고 위치와 헷갈리기 쉬운 항목이라 색을 넣어 눈에 띄게 함 */
.fgrp-accent{background:var(--brand-l);border:1px solid #bcd4ea;border-radius:8px;
  padding:12px 13px 13px}
.fgrp-accent .fgrp-n{background:var(--brand-d)}
.fgrp-accent .fgrp-d{color:var(--brand-d);font-weight:600}

/* ── 버튼 ─────────────────────────────────────────── */
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);
       background:#fff;color:var(--ink);padding:8px 13px;font-size:13.5px}
button:hover{border-color:var(--ink3)}
button:disabled{opacity:.4;cursor:not-allowed}
button.p{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.p:hover:not(:disabled){background:var(--brand-d);border-color:var(--brand-d)}
button.sm{padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 사고유형 칩 */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 14px;font-size:13.5px;border-radius:20px;border-width:1.5px}
.chips button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);
  color:#fff;font-weight:700}

/* ── 결과 문안 ──────────────────────────────────────
   같은 사고정보로 알림 문안과 종료 문안이 함께 나오므로 그룹으로 묶어 표시하고,
   발송 경로(긴급재난문자 / 자체 문자발송시스템)는 색과 테두리를 다르게 해서
   한눈에 구분되게 합니다. 급할 때 잘못된 경로로 복사하는 것을 막기 위한 것입니다. */
.ogrp{margin-bottom:16px}
.ogrp:last-child{margin-bottom:0}
.ohd{display:flex;align-items:center;gap:7px;margin-bottom:7px;
  font-size:12.5px;font-weight:700;color:var(--ink2)}
.ohd:not(.fold)::before{content:"";width:3px;height:13px;background:var(--ink3);border-radius:2px}
.ohd span{font-weight:400;font-size:11.5px;color:var(--ink3)}

/* 접히는 그룹 — 지금 보낼 문안이 먼저 보이도록 나중에 쓸 문안은 접어 둔다 */
.ohd.fold{width:100%;text-align:left;padding:7px 11px;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;cursor:pointer;margin-bottom:0}
.ohd.fold:hover{border-color:var(--brand);background:var(--brand-l)}
.ohd.fold .cv{width:0;height:0;flex:none;border-left:5px solid var(--ink3);
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .12s}
.ohd.fold[aria-expanded=true]{margin-bottom:7px;border-color:var(--line);background:var(--panel)}
.ohd.fold[aria-expanded=true] .cv{transform:rotate(90deg)}
.ohd.fold em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:600;color:var(--brand)}
.ohd.fold .werr{margin-left:auto;font-size:11px;font-weight:700;color:var(--err);
  background:var(--err-l);border:1px solid #eab8b8;border-radius:4px;padding:0 5px}
.ohd.fold .werr + em{margin-left:7px}

.out{border-radius:8px;margin-bottom:9px;overflow:hidden}
.out:last-child{margin-bottom:0}
.out > header{display:flex;align-items:center;gap:7px;padding:7px 11px;
  font-size:12px;font-weight:700;flex-wrap:wrap}
.out > header .ch{letter-spacing:-.01em}
.out > header .no{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;
  font-variant-numeric:tabular-nums}
.out > header .who{margin-left:auto;font-weight:500;font-size:11.5px}

/* 긴급재난문자 — 해당 지역 모든 휴대전화로 강제 송출. 진하게. */
.out.cbs{border:1.5px solid var(--brand);box-shadow:inset 4px 0 0 var(--brand-d)}
.out.cbs > header{background:var(--brand-d);color:#fff;padding-left:14px}
.out.cbs > header .no{background:rgba(255,255,255,.18);color:#fff}
.out.cbs > header .who{color:#bcd3ec}

/* 자체 문자발송시스템·음성전파 — 기관이 직접 보내는 경로. 옅게. */
.out.loc{border:1px solid var(--line);box-shadow:inset 4px 0 0 #c2ccd6}
.out.loc > header{background:var(--panel);color:var(--ink2);
  border-bottom:1px solid var(--line2);padding-left:14px}
.out.loc > header .no{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.out.loc > header .who{color:var(--ink3)}

.msg{padding:11px 12px 11px 14px;font-size:14.5px;line-height:1.7;
  white-space:pre-wrap;background:#fff}
.out.loc .msg{color:var(--ink2)}
.out > footer{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:6px 11px 6px 14px;border-top:1px solid var(--line2);flex-wrap:wrap;background:#fff}
.cnt{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;color:var(--ok)}
.cnt.near{color:var(--warn)} .cnt.over{color:var(--err)}
.cnt small{font-weight:400;color:var(--ink3)}
.cut{padding:0 12px 9px 14px;font-size:11.5px;color:var(--warn);line-height:1.5;background:#fff}

/* 이 문안만의 문제 — 다른 문안은 그대로 쓸 수 있어야 하므로 카드 안에 적는다 */
.out.bad{border-color:var(--err)!important;box-shadow:inset 4px 0 0 var(--err)!important}
.oerr{padding:0 12px 9px 14px;font-size:11.5px;color:var(--err);line-height:1.5;
  background:#fff;font-weight:600}

/* ── 알림 ─────────────────────────────────────────── */
.alert{padding:9px 12px;border-radius:7px;font-size:13px;line-height:1.55;
       margin-bottom:9px;border:1px solid}
.alert b{font-weight:700;margin-right:5px}
.alert.e{background:var(--err-l);border-color:#eab8b8;color:var(--err)}
.alert.w{background:var(--warn-l);border-color:#ebd0a4;color:var(--warn)}
.alert.i{background:var(--brand-l);border-color:#bcd4ea;color:var(--brand-d)}
.alert.s{background:var(--ok-l);border-color:#b3ddc7;color:var(--ok)}
.alert ul{margin:3px 0 0;padding-left:16px}
.alert li{margin-top:2px}

/* ── 체크 ─────────────────────────────────────────── */
.chk{display:flex;align-items:flex-start;gap:7px;font-size:13px;
     padding:4px 0;cursor:pointer;line-height:1.5;color:var(--ink2)}
.chk input{margin:3px 0 0;flex:none;width:15px;height:15px;accent-color:var(--brand)}

/* ── 물질정보 ─────────────────────────────────────── */
.matbar{margin-top:8px;border:1px solid #bcd4ea;background:var(--brand-l);border-radius:7px;
        font-size:12.5px;overflow:hidden}
.matbar > summary{padding:8px 11px;cursor:pointer;list-style:none;color:var(--brand-d);
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;line-height:1.5}
.matbar > summary::-webkit-details-marker{display:none}
.matbar > summary b{font-weight:700}
.matbar > summary .more{margin-left:auto;font-size:11.5px;color:#4c7ba9;white-space:nowrap}
.matbar[open] > summary .more::after{content:" ▲"}
.matbar:not([open]) > summary .more::after{content:" ▼"}
.matbar .body{padding:0 11px 11px;background:#fff;border-top:1px solid #cfe0f0}
.matbar.none{background:var(--warn-l);border-color:#ebd0a4}
.matbar.none > summary{color:var(--warn)}
.matbar dl{margin:11px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
.matbar dt{font-weight:600;color:var(--ink2);white-space:nowrap}
.matbar dd{margin:0;line-height:1.55;white-space:pre-line;color:var(--ink)}
.matbar .src{margin:10px 0 0;font-size:11px;color:var(--ink3);line-height:1.5}

/* ── 대피장소 찾기 ────────────────────────────────── */
.finder{border:1px solid var(--line);border-radius:7px;background:var(--panel);
        padding:11px;margin-top:8px;animation:slideDown .3s var(--ease) both}
.finder .cntlbl{font-size:11.5px;color:var(--ink3);font-weight:400;margin-left:5px}

/* ── 참고 사례 ────────────────────────────────────── */
.case{border-bottom:1px solid var(--line2);padding:8px 0;font-size:13px;line-height:1.6}
.case:last-child{border-bottom:0}
.case .meta{font-size:11px;color:var(--ink3);margin-bottom:2px;
            display:flex;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}

/* ── 참고 사례 창 — "실제 발송 사례" 단추를 눌렀을 때만 뜬다.
   나중에 100건 넘게 늘어나도 본문을 밀어내지 않도록 목록만 스크롤됩니다. */
.cbx-back{position:fixed;inset:0;z-index:1000;background:rgba(9,20,33,.55);
  display:flex;align-items:center;justify-content:center;padding:18px;
  animation:cbxFade .2s var(--ease) both}
.cbx{background:var(--card);border-radius:12px;width:100%;max-width:680px;
  max-height:100%;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 18px 48px rgba(0,0,0,.3);animation:revealIn .3s var(--ease) both}
@keyframes cbxFade{from{opacity:0}to{opacity:1}}
.cbx > header{display:flex;align-items:center;gap:8px;padding:11px 14px;
  background:var(--brand-d);color:#fff;flex:none}
.cbx > header b{font-size:14.5px}
.cbx-n{font-size:12px;color:#bcd3ec}
.cbx-x{margin-left:auto;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);
  color:#fff;padding:2px 9px;font-size:14px;line-height:1.4;flex:none}
.cbx-x:hover{background:rgba(255,255,255,.3)}
.cbx-alert{margin:11px 14px 0}
.cbx-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;flex:none}
.cbx-bar label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.cbx-bar select{width:auto;min-width:150px}
.cbx-body{overflow-y:auto;padding:0 14px 14px;flex:1;min-height:0}
@media (max-width:560px){
  .cbx-back{padding:0}
  .cbx{max-width:none;border-radius:0;height:100%}
}
@media print{ .cbx-back{display:none!important} }

/* ── 반응형 ───────────────────────────────────────── */
@media (max-width:980px){
  .cols{grid-template-columns:1fr}
  .sticky{position:static}
}
@media (max-width:560px){
  .wrap{padding:0 12px 48px}
  .stepsz{padding:16px 0}
  body.has-stage .stepsz{padding:10px 0 8px}
  .steps{gap:7px}
  /* 정사각형 크기도 height 로 직접 줘야 줄어들 때 매끄럽게 보간된다
     (aspect-ratio 는 height 가 이미 정해져 있으면 무시되는 값이라 여기선 no-op) */
  .steps button.stp{height:29vw;padding:9px 6px 8px;border-radius:13px;gap:6px}
  .stp-ic{width:30px;height:30px}
  .steps button.stp b{font-size:12.5px}
  .stp-d{display:none}
  body.has-stage .steps button.stp{height:52px;padding:6px 6px}
  body.has-stage .stp-ic{width:19px;height:19px}
  body.has-stage .steps button.stp b{font-size:11px}
  .panel .body{padding:13px}
  .msg{font-size:15.5px}
  .matbar dl{grid-template-columns:1fr;gap:1px}
  .matbar dt{margin-top:6px}
}
@media print{
  .top{background:#fff;color:#000;border-bottom:2px solid #000}
  .top .sub,.note,button,.noprint,.stepsz{display:none!important}
  body{background:#fff;font-size:11pt;display:block}
  .cols{grid-template-columns:1fr}
  .panel{border:0}
  /* 인쇄물에서도 발송 경로가 구분되어야 합니다 (배경색은 인쇄되지 않을 수 있음) */
  .out{break-inside:avoid;box-shadow:none!important}
  .out.cbs{border:2px solid #000}
  .out.loc{border:1px dashed #666}
  .out.cbs > header{background:#fff;color:#000;border-bottom:1.5px solid #000}
  .out.cbs > header .no,.out.loc > header .no{background:#fff;color:#000;border:1px solid #000}
  .out.cbs > header .who,.out.loc > header .who{color:#000}
  .ohd{color:#000}
}

/* ══ 대피장소 지도 ══════════════════════════════════════════
   지도가 주인공인 화면이라 한 화면에 꽉 채웁니다(스크롤 없이 지도·목록이
   동시에 보이도록). 지도는 화면 픽셀 좌표계로 그리므로(assets/mapcore.js)
   아래 선 굵기·글자 크기는 그대로 화면 픽셀이며 확대해도 변하지 않습니다. */
body.mapapp{display:flex;flex-direction:column;height:100vh;overflow:hidden}
@supports (height:100dvh){ body.mapapp{height:100dvh} }
.mapapp .top{flex:none;padding:11px 0}
.mapapp .top .wrap{max-width:none;padding:0 16px}

/* 조건 줄 — 시·도/시·군·구/찾는 범위는 오른쪽 목록 패널로 옮기고(.ms-find),
   여기는 주소 검색·영향반경 물질·풍향·배경지도만 남겨 더 넓게 쓴다.
   글자가 작아 안 보인다는 의견을 받아 줄 높이와 글자 크기를 키웠다. */
.mbar{flex:none;background:var(--panel);border-bottom:1px solid var(--line)}
.mbar-in{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:14px 18px;min-height:64px}
.mb-f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink2)}
.mb-f select,.mb-f input[type=text]{width:auto;min-width:150px;font-weight:400;
  padding:8px 11px;font-size:14.5px;border-radius:7px}
.mb-f input[type=text]{min-width:170px}
.mb-addr{position:relative}
.mb-addr input[type=text]{min-width:260px}

/* 풍향 단추 — 실제 나침반(.windpop, JS 로 생성)은 이 단추를 누르면 뜬다 */
.mb-wind{position:relative}
.windbtn{display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:14.5px;
  font-weight:600;color:var(--ink);border-radius:7px;min-width:150px}
.windbtn-ic{width:17px;height:17px;flex:none;color:var(--ink3)}
.windbtn.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.windbtn.on .windbtn-ic{color:var(--brand-d)}

/* 배경지도 고르기 */
.mb-lyr{display:flex;gap:0;margin-left:auto}
.mb-lyr button{padding:9px 14px;font-size:13.5px;border-radius:0;border-left-width:0;background:#fff}
.mb-lyr button:first-child{border-radius:6px 0 0 6px;border-left-width:1px}
.mb-lyr button:last-child{border-radius:0 6px 6px 0}
.mb-lyr button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.mb-lyr button[aria-pressed=true] + button{border-left-color:var(--brand)}
.mb-lyr button:disabled{background:var(--panel);color:var(--ink3);text-decoration:line-through}

/* 주소·장소 검색 결과 — 사고물질 목록(.mpk)과 같은 모양을 그대로 쓴다 */
#addrPop.mpk{z-index:950}
#addrPop .mpk-list{max-height:320px}

/* 풍향 고르기 창 — 나침반 */
.windpop{position:fixed;z-index:950;background:#fff;border:1px solid var(--brand);
  border-radius:10px;box-shadow:0 6px 24px rgba(16,32,48,.18);padding:12px;width:216px;
  animation:revealIn .2s var(--ease) both}
.windpop-hd{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:10px;text-align:center}
.windpop-hd b{color:var(--brand-d)}
.windrose{position:relative;width:168px;height:168px;margin:0 auto}
.wr-ring{position:absolute;inset:8px;border:1.5px dashed var(--line);border-radius:50%}
.wr-hub{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;
  border-radius:50%;background:var(--ink3);z-index:1}
.wr-cap{text-align:center;font-size:12px;line-height:1.5;color:var(--ink2);
  margin:10px 0 12px}
.wr-cap b{color:var(--brand-d);font-weight:800}
.wr-b{position:absolute;width:34px;height:34px;margin:-17px;padding:0;border-radius:50%;
  font-size:11px;font-weight:700;background:#fff;display:flex;align-items:center;justify-content:center}
.wr-b[aria-pressed=true]{background:var(--brand);border-color:var(--brand-d);color:#fff;
  box-shadow:0 0 0 3px var(--brand-l)}
/* 풍하방향 화살표 — 나침반 가운데서 시작해 고른 방향의 반대쪽을 가리킨다.
   기본자세(0deg)가 북쪽(위)을 향해야 rotate(풍하방향deg) 가 그대로 맞으므로,
   막대는 가운데(바닥)에서 위로 자라도록 두고 그 끝점을 축으로 돌린다. */
.wr-arrow{position:absolute;left:50%;bottom:50%;width:3px;height:58px;background:var(--err);
  transform-origin:50% 100%;border-radius:2px 2px 0 0}
.wr-arrow::after{content:"";position:absolute;left:50%;top:-1px;width:0;height:0;
  transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:9px solid var(--err)}
.windpop-clear{width:100%;justify-content:center;display:flex}

.mbar-warn{flex:none;padding:8px 16px;background:var(--warn-l);
  border-bottom:1px solid #ebd0a4;color:var(--warn);font-size:12px;line-height:1.55;
  animation:slideDown .26s var(--ease) both}
.mbar-warn a{color:var(--brand-d);font-weight:700}

/* 영향 참고 반경 줄 */
.mrad{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:7px 16px;background:var(--brand-l);border-bottom:1px solid #bcd4ea;
  animation:slideDown .26s var(--ease) both}
.mr-lb{font-size:11.5px;font-weight:700;color:var(--brand-d)}
.mr-nm{font-size:12.5px;color:var(--ink);margin-right:4px}
.mr-none{font-size:12px;color:var(--warn);font-weight:600}
.mrad button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
input[type=text].mr-in{width:92px;padding:4px 8px;font-size:12.5px;flex:none}
.mr-more{font-size:11.5px;color:var(--brand-d);margin-left:4px}
.mr-more > summary{cursor:pointer;font-weight:600}
.mr-more dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;
  background:#fff;border:1px solid #cfe0f0;border-radius:6px;padding:8px 10px;
  max-width:760px;color:var(--ink)}
.mr-more dt{font-weight:600;color:var(--ink2);white-space:nowrap}
.mr-more dd{margin:0;line-height:1.5}
.mr-more .src{margin:5px 0 0;font-size:11px;color:var(--ink3);line-height:1.5;max-width:760px}

/* 사고지점 요약 줄 — "이 근방에 무엇이 있나"를 한 줄로 */
.msum{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px 16px;background:#0d3f70;color:#fff;font-size:12.5px;
  animation:slideDown .26s var(--ease) both}
.ms-near{display:flex;align-items:baseline;gap:6px}
.ms-near b{font-weight:700;color:#bcd3ec;font-size:11.5px}
.ms-near em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.ms-bands{display:flex;gap:8px;flex-wrap:wrap}
.ms-b{background:rgba(255,255,255,.13);border-radius:20px;padding:1px 10px;
  font-variant-numeric:tabular-nums}
.ms-b.z{opacity:.55}
.ms-warn{background:rgba(255,255,255,.13);border-radius:20px;padding:1px 10px}
.ms-warn.on{background:var(--err);font-weight:700}
.ms-none{color:#bcd3ec}
.ms-more{margin-left:auto;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);
  color:#fff;font-size:12px;padding:3px 11px;font-weight:600}
.ms-more:hover{background:rgba(255,255,255,.3);border-color:#fff}

/* 지도 + 목록 */
.mmain{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px}
.mmap{position:relative;background:#eaf0f5;min-height:0;border-right:1px solid var(--line)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;
  touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
#map.crosshair{cursor:crosshair}
#map .bg{fill:#eef3f7}
#map .bds .bd{fill:none;stroke:#9fb2c4;stroke-width:.8px}
#map .bds .bd.on{stroke:var(--brand);stroke-width:1.6px}

/* 거리 눈금 — 배경을 가리지 않게 얇고 옅게 */
#map circle.grid{fill:none;stroke:#0d3f70;stroke-width:1px;stroke-dasharray:3 4;opacity:.5}
#map text.gridlbl{fill:#0d3f70;text-anchor:middle;font-weight:700;paint-order:stroke;
  stroke:#fff;stroke-width:.32em;stroke-linejoin:round;pointer-events:none}

/* 영향 참고 반경 */
#map circle.ring{fill:rgba(179,31,31,.07);stroke:var(--err);stroke-width:1.8px;stroke-dasharray:7 4}
#map text.ringlbl{fill:var(--err);text-anchor:middle;font-weight:700;paint-order:stroke;
  stroke:#fff;stroke-width:.32em;stroke-linejoin:round;pointer-events:none}

/* 풍하방향 */
#map path.lee{fill:rgba(138,79,6,.10);stroke:rgba(138,79,6,.35);stroke-width:1px}
#map text.leelbl{fill:var(--warn);text-anchor:middle;font-weight:700;paint-order:stroke;
  stroke:#fff;stroke-width:.32em;stroke-linejoin:round;pointer-events:none}

/* ── 사고지점 ↔ 고른 곳 경로선 ────────────────────────────────
   예전에는 얇은 점선이었는데, 배경지도를 깔면 도로 위에서 잘 보이지 않아
   "어디로 가야 하는지"가 한눈에 안 들어왔습니다. 흰 테두리를 먼저 깔고
   그 위에 굵은 색선을 올려 어떤 배경에서도 읽히게 합니다.

   실선이 아니라 긴 점선인 것은 일부러입니다 — 이 선은 실제 도로 경로가
   아니라 두 점을 잇는 직선이므로, 도로를 따라간 길로 보이면 안 됩니다. */
#map path.route-cas,#map path.route{pointer-events:none}   /* 아래 마커를 가리지 않게 */
#map path.route-cas{fill:none;stroke:#fff;stroke-width:9px;stroke-linecap:round;opacity:.92}
#map path.route{fill:none;stroke:#e0218a;stroke-width:5px;stroke-linecap:round;
  stroke-dasharray:15 9;animation:routeIn .42s var(--ease) both}
@keyframes routeIn{from{stroke-dashoffset:70;opacity:0}to{stroke-dashoffset:0;opacity:1}}
#map text.linklbl{fill:#b3156d;text-anchor:middle;font-weight:700;paint-order:stroke;
  stroke:#fff;stroke-width:.42em;stroke-linejoin:round;pointer-events:none}

/* 대피장소 */
#map circle.mk{fill:#fff;stroke:var(--ok);stroke-width:1.8px;cursor:pointer}
#map circle.mk.hv{fill:var(--ok-l)}
#map circle.mk.lee{stroke:var(--warn)}
#map circle.mk.in{fill:#fdeaea;stroke:var(--err)}
#map circle.mk.on{fill:var(--brand);stroke:#fff;stroke-width:2.4px}
#map circle.mk.on.in{fill:var(--err);stroke:#fff}
#map text.mkl{fill:#12181f;text-anchor:middle;font-weight:600;paint-order:stroke;
  stroke:#fff;stroke-width:.28em;stroke-linejoin:round;pointer-events:none}
#map text.mkl.on{fill:var(--brand-d)}
#map text.mkh{fill:#5c6b7a;text-anchor:middle;paint-order:stroke;
  stroke:#fff;stroke-width:.3em;pointer-events:none}

/* 사고지점 */
#map line.acc{stroke:var(--err);stroke-width:2.6px}
#map circle.accdot{fill:none;stroke:var(--err);stroke-width:1.8px}
#map text.acclbl{fill:var(--err);text-anchor:middle;font-weight:700;paint-order:stroke;
  stroke:#fff;stroke-width:.32em;stroke-linejoin:round;pointer-events:none}

/* ── 내 위치 ──────────────────────────────────────────────────
   사고지점(빨강 십자)과 절대 헷갈리면 안 되므로 색도 모양도 다르게 둡니다
   — 파란 동그라미입니다. 둘레의 옅은 원은 '이 안 어딘가'라는 뜻으로,
   단말이 알려 준 오차 범위를 그대로 그린 것입니다. 실내에서는 이 원이
   수백 미터까지 커지는데, 그 사실이 보여야 좌표를 곧이곧대로 믿지 않습니다. */
#map circle.me,#map circle.meacc{pointer-events:none}
#map circle.meacc{fill:rgba(22,104,216,.12);stroke:rgba(22,104,216,.45);stroke-width:1.2px}
#map circle.mepulse{fill:none;stroke:#1668d8;stroke-width:2.2px;
  transform-box:fill-box;transform-origin:center;
  animation:mePulse 2.2s var(--ease) infinite;pointer-events:none}
@keyframes mePulse{from{transform:scale(.3);opacity:.85}to{transform:scale(1);opacity:0}}
#map circle.me{fill:#1668d8;stroke:#fff;stroke-width:2.6px;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
#map text.melbl{fill:#0f4fa8;text-anchor:middle;font-weight:700;paint-order:stroke;
  stroke:#fff;stroke-width:.32em;stroke-linejoin:round;pointer-events:none}

/* 배경지도가 깔렸을 때 — 도로·건물 위에서 묻히지 않게 대비를 올린다 */
#map.hasbg .bg{fill:#dfe6ec}
#map.hasbg .bds .bd{stroke:rgba(11,87,164,.28);stroke-width:.7px}
#map.hasbg .bds .bd.on{stroke:#b31f1f;stroke-width:2px;stroke-dasharray:7 4;stroke-linejoin:round}
#map.hasbg circle.mk{stroke-width:2.2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
#map.hasbg text.mkl{stroke-width:.34em}
#map.hasbg circle.grid{stroke-width:1.4px;opacity:.75}

/* 지도 위 겹쳐 놓는 것들 */
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:32px;height:32px;padding:0;font-size:15px;line-height:1;
  background:rgba(255,255,255,.95)}
.maplegend{position:absolute;left:10px;top:10px;display:flex;gap:9px;flex-wrap:wrap;
  background:rgba(255,255,255,.92);border-radius:6px;padding:4px 9px;
  font-size:11.5px;color:var(--ink2);pointer-events:none;max-width:calc(100% - 70px)}
.maplegend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:4px;vertical-align:-1px;border:1.5px solid var(--ok);background:#fff}
.maplegend .dot.ac{background:var(--err);border-color:var(--err)}
.maplegend .dot.in{background:#fdeaea;border-color:var(--err)}
.maplegend .dot.lee{background:rgba(138,79,6,.2);border-color:var(--warn)}
.maplegend .dot.gr{background:none;border-style:dashed;border-color:#0d3f70}
.maplegend .dot.me{background:#1668d8;border-color:#fff;box-shadow:0 0 0 1px #1668d8}
.mapscale{position:absolute;left:10px;bottom:56px;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.92);border-radius:4px;padding:2px 7px;font-size:11px}
.mapscale i{display:block;height:4px;border:1px solid var(--ink2);border-top:0}
.mapscale b{font-variant-numeric:tabular-nums;color:var(--ink2)}
.mapaddr{position:absolute;left:10px;max-width:min(380px,calc(100% - 62px));bottom:84px;
  background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:7px;
  padding:7px 11px;font-size:12.5px;line-height:1.5;
  box-shadow:0 2px 8px rgba(0,0,0,.14);pointer-events:none;
  animation:revealIn .26s var(--ease) both}
.mapaddr b{font-weight:700}
.mapaddr i{font-style:normal;font-size:11.5px;color:var(--ink3);margin-left:4px}
.mapaddr span{display:block;color:var(--ink2);font-size:11.5px}
.mapaddr em{font-style:normal;font-size:11.5px;color:var(--brand-d);font-weight:600}
.mapaddr em + em::before{content:" · ";color:var(--ink3);font-weight:400}

/* ── 유리 패널 ────────────────────────────────────────────────
   지도 위에 겹쳐 놓는 것들만 반투명으로 둡니다. 아래에 깔린 도로·건물이
   비쳐 보여야, 이 패널이 지금 지도의 어디를 가리고 있는지 알 수 있습니다.

   오른쪽 목록과 위쪽 조건 줄에는 쓰지 않습니다. 거기는 오래 들여다보며
   읽는 곳이라, 급할 때 읽을 글자를 지도 무늬 위에 얹으면 안 됩니다. */
.maplegend,.mapscale,.mapaddr,.mnear,.mapctl button{
  background:rgba(255,255,255,.66);
  -webkit-backdrop-filter:blur(12px) saturate(1.5);
  backdrop-filter:blur(12px) saturate(1.5);
  border:1px solid rgba(255,255,255,.68);
  box-shadow:0 4px 18px rgba(10,32,60,.16)}
.mapctl button:hover{background:rgba(255,255,255,.9)}
/* 흐림 효과를 지원하지 않는 브라우저에서는 글자가 지도 위에 그대로 얹혀
   읽히지 않습니다. 그런 곳에서는 불투명에 가깝게 되돌립니다. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .maplegend,.mapscale,.mapaddr,.mnear,.mapctl button{background:rgba(255,255,255,.95)}
}

/* ── 가까운 3곳 ───────────────────────────────────────────────
   오른쪽에 전체 목록이 이미 있는데도 따로 두는 이유는, 급할 때 필요한 것이
   훑어볼 목록이 아니라 "그래서 어디로 보내면 되는가" 세 줄이기 때문입니다.
   지도에서 눈을 떼지 않고 읽도록 지도 위에 겹쳐 둡니다. */
.mnear{position:absolute;left:10px;top:46px;width:min(272px,calc(100% - 62px));
  border-radius:9px;padding:8px 9px 9px;font-size:12px;
  animation:revealIn .3s var(--ease) both}
.mnear-h{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  color:var(--ink3);margin-bottom:4px}
.mnear-h b{color:var(--brand-d);font-size:11.5px}
.mnear-x{margin-left:auto;width:19px;height:19px;padding:0;border:0;background:none;
  color:var(--ink3);font-size:13px;line-height:1;cursor:pointer;border-radius:4px}
.mnear-x:hover{background:rgba(10,40,80,.12);color:var(--ink)}
.mnear-it{display:block;width:100%;text-align:left;border:0;background:none;
  padding:5px 6px;border-radius:6px;cursor:pointer;font:inherit;color:inherit}
.mnear-it + .mnear-it{border-top:1px solid rgba(10,40,80,.13)}
.mnear-it:hover{background:rgba(11,87,164,.12)}
.mnear-it.on{background:rgba(11,87,164,.18)}
.mnear-r{display:flex;align-items:baseline;gap:6px}
.mnear-r b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnear-n{flex:none;width:15px;height:15px;border-radius:50%;background:var(--brand);
  color:#fff;font-size:10px;font-weight:700;text-align:center;line-height:15px}
.mnear-d{margin-left:auto;flex:none;font-variant-numeric:tabular-nums;font-weight:700;
  color:var(--brand-d)}
.mnear-t{display:block;color:var(--ink2);font-size:11px;margin:1px 0 0 21px}
.mnear-t em{font-style:normal;font-weight:700;color:#0f4fa8}
.mnear-note{margin-top:5px;padding-top:5px;border-top:1px solid rgba(10,40,80,.13);
  font-size:10.5px;color:var(--ink3);line-height:1.45}

/* 내 위치 찾기 결과 알림 — 지도 위에 잠깐 떴다 사라집니다.
   실패했을 때 다음에 무엇을 하면 되는지까지 적으므로 두세 줄이 될 수
   있어, 조건 줄에 끼워 넣지 않고 지도 위에 따로 띄웁니다. */
.mtoast{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);z-index:5;
  max-width:min(430px,calc(100% - 32px));background:rgba(17,31,46,.92);color:#fff;
  border-radius:8px;padding:8px 13px;font-size:12.5px;line-height:1.5;
  box-shadow:0 6px 22px rgba(0,0,0,.3);animation:revealIn .26s var(--ease) both}
.mtoast.err{background:rgba(134,21,21,.95)}
.mtoast b{font-weight:700}

/* 내 위치 단추 — 지도에 찍히는 파란 점과 같은 색으로 두어,
   무엇이 어디에 표시되는 단추인지 누르기 전에 보이게 합니다. */
.btnme{display:inline-flex;align-items:center;gap:4px;
  border-color:#7fb0ea;color:#0f4fa8;font-weight:700}
.btnme:hover{background:#eaf2fd;border-color:#1668d8}
.btnme[aria-busy=true]{opacity:.6;pointer-events:none}
.btnme svg{width:13px;height:13px;flex:none}

/* 사고지점 조작 줄 — 지도 아래에 붙여 둔다 */
.mapacc{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;
  gap:8px;flex-wrap:wrap;padding:7px 10px;background:rgba(255,255,255,.95);
  border-top:1px solid var(--line)}
.mapacc label{display:flex;align-items:center;gap:5px;font-size:11.5px;
  font-weight:700;color:var(--ink2)}
.mapacc input[type=text]{width:104px;padding:4px 8px;font-size:12.5px}
.mapacc .mapchk{margin-left:auto;font-weight:600}
.mapacc .mapchk input{width:15px;height:15px;accent-color:var(--brand)}
#btnAcc[aria-pressed=true]{background:var(--err);border-color:var(--err);color:#fff;font-weight:700}

/* 목록 */
.mside{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--card)}
/* 대피장소로 찾는 기능(시·도/시·군·구/찾는 범위) — 조건 줄에서 이리로 옮겨,
   대피장소 목록과 한 흐름(어디서 찾을지 → 무엇이 나왔는지)으로 붙였다 */
.ms-find{flex:none;padding:12px 13px 13px;background:var(--panel);
  border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:9px}
.ms-find-row{display:flex;gap:9px}
.ms-find-row .mb-f{flex:1;min-width:0}
.ms-find .mb-f.wide{width:100%}
.ms-find .mb-f select{width:100%;min-width:0}
.ms-hd{flex:none;padding:9px 13px;font-size:12.5px;font-weight:700;color:var(--ink2);
  border-bottom:1px solid var(--line2)}
.ms-hd span{font-weight:400;color:var(--ink3)}
.ms-tools{flex:none;display:flex;gap:6px;padding:7px 13px;background:var(--panel);
  border-bottom:1px solid var(--line2)}
.ms-tools input[type=text]{flex:1;min-width:0;padding:5px 9px;font-size:12.5px}
.ms-tools select{width:auto;flex:none;padding:5px 6px;font-size:12px}
.ms-list{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable}
.ms-empty{padding:22px 14px;color:var(--ink3);font-size:12.5px;line-height:1.8;margin:0}
.ms-it{padding:8px 13px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:12.5px}
.ms-it:hover{background:var(--panel)}
.ms-it.on{background:var(--brand-l);box-shadow:inset 3px 0 0 var(--brand)}
.ms-it.ring{background:var(--err-l)}
.ms-it.ring:hover{background:#fbdede}
.ms-it.ring.on{background:#f8d4d4;box-shadow:inset 3px 0 0 var(--err)}
.ms-it .l1{display:flex;align-items:baseline;gap:6px}
.ms-it .l1 b{font-weight:700}
.ms-it .l1 .dt{font-weight:400;font-size:11.5px;color:var(--ink3)}
.ms-it .l1 .d{margin-left:auto;flex:none;font-size:11.5px;font-weight:700;
  color:var(--brand-d);font-variant-numeric:tabular-nums;white-space:nowrap}
/* 거리 막대 — 줄끼리 견주어 보라고 넣는다 */
.ms-bar{height:3px;background:var(--line2);border-radius:2px;margin:4px 0 3px;overflow:hidden}
.ms-bar i{display:block;height:100%;background:var(--brand);opacity:.55}
.ms-it.ring .ms-bar i{background:var(--err);opacity:.7}
/* 이동시간 줄 — 거리(미터)만으로는 대피 안내를 쓸 수 없어 함께 적는다.
   어림값이라는 사실은 카드 아래 안내와 자료 출처에 적어 둔다. */
.ms-it .l6{font-size:11.5px;margin-top:2px;color:var(--ink3)}
.ms-it .l6 em{font-style:normal;font-weight:700;color:#0f4fa8}
.ms-it .l2{color:var(--ink2);font-size:11.5px;margin-top:2px;line-height:1.5}
.ms-it .l3{color:var(--brand-d);font-size:11.5px;margin-top:2px}
.ms-it .l5{margin-top:3px;display:flex;gap:5px;flex-wrap:wrap}
.ms-it .l5 .tag{font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:700}
.ms-it .l5 .tag.danger{background:var(--err-l);color:var(--err)}
.ms-it .l5 .tag.lee{background:var(--warn-l);color:var(--warn)}
.ms-it .l4{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ms-cp{display:flex;gap:5px}
.ms-cp button{padding:2px 8px;font-size:11px}

/* 자료 출처 창 */
#ver p{margin:0 0 9px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
#ver p b{color:var(--ink)}
#ver .src{margin-top:12px;padding-top:9px;border-top:1px solid var(--line2);
  font-size:11.5px;color:var(--ink3)}

@media (max-width:1080px){ .mmain{grid-template-columns:minmax(0,1fr) 380px} }
@media (max-width:860px){
  body.mapapp{height:auto;overflow:visible}
  .mmain{grid-template-columns:1fr;flex:none}
  .mmap{height:56vh;border-right:0}
  .mside{height:auto}
  .ms-list{overflow:visible}
  .ms-find-row{flex-wrap:wrap}
  .mb-lyr{margin-left:0}
  .mb-f select,.mb-f input[type=text]{min-width:120px}
  .mb-addr input[type=text]{min-width:150px}
  .windbtn{min-width:0}
  /* 좁은 화면에서는 사고지점 줄이 지도를 많이 가리지 않게 촘촘히 */
  .mapacc{gap:5px;padding:5px 8px;font-size:11px}
  .mapacc label{gap:3px}
  .mapacc input[type=text]{width:84px;padding:3px 6px;font-size:12px}
  .mapacc .sm{padding:3px 9px}
  .mapscale{bottom:64px}
  /* 좁은 화면에서는 지도가 이미 작습니다 — 3곳 카드가 지도를 절반 넘게
     가리지 않도록 폭을 줄이고, 안내 문구는 뺍니다(목록에도 같은 값이 있음). */
  .mnear{width:min(224px,calc(100% - 62px));padding:6px 8px 7px;font-size:11.5px}
  .mnear .mnear-note{display:none}
  .mapaddr{bottom:92px}
}
@media print{
  body.mapapp{height:auto;overflow:visible;display:block}
  .mbar,.mapctl,.mapacc,.ms-tools,.mbar-warn,.ms-find,.windpop,#addrPop{display:none!important}
  .mmain{display:block}
  .mmap{position:relative;height:440px;page-break-inside:avoid;border:1px solid #000}
  .msum{background:#fff;color:#000;border:1px solid #000;border-width:1px 0}
  .msum .ms-near b,.msum .ms-none{color:#333}
  .ms-b,.ms-warn{background:#eee;color:#000}
  .ms-warn.on{background:#fff;border:1px solid #000;font-weight:700}
  .mside{height:auto}
  .ms-list{overflow:visible}
  .ms-it{break-inside:avoid}
  /* 유리 효과는 종이에서 배경이 빠져 글자만 흐리게 남습니다 — 불투명으로 되돌립니다.
     '가까운 3곳'은 인쇄물에서도 결론에 해당하므로 남기고, 닫기 단추만 뺍니다. */
  .maplegend,.mapscale,.mapaddr,.mnear{background:#fff!important;
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    border:1px solid var(--line)!important;box-shadow:none!important}
  .mnear-x{display:none!important}
}

a.btnlink{display:inline-block;text-decoration:none;color:var(--brand-d);font-weight:600;
  border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12.5px;background:#fff}
a.btnlink:hover{border-color:var(--brand)}

/* ══ ③ 방제자원 동원 ═══════════════════════════════════════
   ② 대피장소 지도의 뼈대(.mmain / .mmap / .mside)를 그대로 쓰고,
   ③ 에만 있는 것(자원 종류 · 연락처 · 동원 목록)만 여기 더합니다. */

/* 자원 종류 색 — 색만으로 구분하면 배경지도 위에서 헷갈리고 색각 이상이
   있으면 구분이 안 되므로, 지도 마커는 모양도 함께 다르게 그립니다
   (res/app.js 의 markerShape). 여기 색은 모양을 거드는 역할입니다. */
:root{
  --rk-waste:#6b4c9a;    /* 폐기물 처리 — 보라 ● */
  --rk-equip:#0b6b41;    /* 방제장비  — 초록 ■ */
  --rk-heavy:#b3651f;    /* 중장비    — 주황 ▲ */
  --rk-capsule:#b31f1f;  /* 비상캡슐  — 빨강 ◆ (가장 급함) */
}

/* 목록·범례에 쓰는 작은 표식 */
.rkdot{display:inline-block;width:10px;height:10px;flex:none;margin-right:5px;
  vertical-align:-1px;background:var(--ink3)}
.rkdot.rk-waste{background:var(--rk-waste);border-radius:50%}
.rkdot.rk-equip{background:var(--rk-equip);border-radius:2px}
.rkdot.rk-heavy{background:var(--rk-heavy);
  clip-path:polygon(50% 0,100% 100%,0 100%)}
.rkdot.rk-capsule{background:var(--rk-capsule);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

/* 예시 자료 / 내부용 알림 띠 — 무엇을 보고 있는지 화면에서 바로 알려 준다.
   내부판은 개인 연락처가 들어 있어 실수로 공유되면 안 되므로 진하게. */
.databar{flex:none;display:flex;flex-wrap:wrap;gap:6px 18px;
  padding:8px 16px;font-size:12.5px;line-height:1.5;
  animation:slideDown .26s var(--ease) both}
.databar b{font-weight:800;margin-right:5px}
.databar.is-example{background:var(--warn-l);border-bottom:1px solid #ebd0a4;color:var(--warn)}
.databar.is-internal{background:#7a1414;border-bottom:1px solid #5d0f0f;color:#fff}
.databar.is-internal .db-ex{color:#ffd9a8}

/* 자원 종류 고르기 칩 */
.rk-lb{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:7px}
.rk-chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rk-chip{display:flex;align-items:center;justify-content:flex-start;
  padding:8px 10px;font-size:12.5px;font-weight:600;text-align:left;
  background:#fff;border-radius:7px;line-height:1.3}
.rk-chip[aria-pressed=false]{color:var(--ink3);background:var(--panel);opacity:.72}
.rk-chip[aria-pressed=false] .rkdot{filter:grayscale(1);opacity:.6}
.rk-chip[aria-pressed=true]{border-color:var(--brand);background:var(--brand-l);
  color:var(--brand-d)}

/* 요약 줄 — 종류별로 가장 가까운 곳. 누르면 그 자원이 선택된다.
   ② 는 "가장 가까운 대피장소 하나"가 답이지만, 방제자원은 종류마다
   하나씩 필요하므로 네 개를 나란히 보여 준다. */
.msum .ms-k{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);
  border-radius:20px;padding:2px 11px;color:#fff;font-size:12.5px;
  display:inline-flex;align-items:center;gap:2px}
.msum .ms-k:hover{background:rgba(255,255,255,.28);border-color:#fff}
.msum .ms-k.z{opacity:.5}
.msum .ms-k em{font-style:normal;font-weight:700;margin-left:4px;
  font-variant-numeric:tabular-nums}
.msum .ms-k .rkdot{width:9px;height:9px;margin-right:2px;
  box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.msum .ms-note{margin-left:auto;color:#bcd3ec;font-size:11.5px}

/* 목록 줄 */
.rs-it .l1{align-items:center}
.rs-cap{font-size:12px;color:var(--ink);margin-top:3px;line-height:1.5}
.rs-approx{font-size:10.5px;font-weight:700;color:var(--warn);
  background:var(--warn-l);border-radius:4px;padding:0 5px;white-space:nowrap}
.rs-tel{margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rs-t1{font-size:11px;font-weight:700;color:var(--ink3)}
.rs-t1.rs-in{color:#7a1414;margin-left:6px}
.rs-num{font-size:13.5px;font-weight:700;color:var(--brand-d);text-decoration:none;
  font-variant-numeric:tabular-nums;border-bottom:1px solid transparent}
.rs-num:hover{border-bottom-color:var(--brand-d)}
.rs-num-in{color:#7a1414}
.rs-num-in:hover{border-bottom-color:#7a1414}
/* 동원 목록에 담긴 줄 */
.ms-it.inmob{box-shadow:inset 3px 0 0 var(--ok)}
.ms-it.inmob.on{box-shadow:inset 3px 0 0 var(--brand)}

/* 동원 목록 막대 — 목록 맨 아래 붙는다 */
.mob{flex:none;display:flex;align-items:center;gap:8px;padding:9px 13px;
  background:var(--ok-l);border-top:1px solid #b3ddc7;
  animation:slideUp .26s var(--ease) both}
.mob-n{font-size:12.5px;font-weight:700;color:var(--ok);margin-right:auto}
.mob-n b{font-variant-numeric:tabular-nums}

/* 지도 마커 — 모양은 res/app.js 가 그리고 색만 여기서 준다 */
#map .rk{stroke:#fff;stroke-width:1.6px;cursor:pointer}
#map .rk-waste{fill:var(--rk-waste)}
#map .rk-equip{fill:var(--rk-equip)}
#map .rk-heavy{fill:var(--rk-heavy)}
#map .rk-capsule{fill:var(--rk-capsule)}
#map .rk.hv{stroke:var(--ink);stroke-width:2.2px}
#map .rk.on{stroke:var(--brand-d);stroke-width:3px}
#map .rk.mob{stroke:var(--ok);stroke-width:3px}
/* 좌표를 주소에서 정확히 못 찾은 곳 — 속을 비워 "대략 위치"임을 보인다 */
#map .rk.approx{fill:#fff;stroke-width:2.4px}
#map .rk.approx.rk-waste{stroke:var(--rk-waste)}
#map .rk.approx.rk-equip{stroke:var(--rk-equip)}
#map .rk.approx.rk-heavy{stroke:var(--rk-heavy)}
#map .rk.approx.rk-capsule{stroke:var(--rk-capsule)}
#map.hasbg .rk{stroke-width:2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}

@media (max-width:560px){
  .rk-chips{grid-template-columns:1fr}
  .msum .ms-note{margin-left:0;flex-basis:100%}
}
@media print{
  .databar.is-internal{background:#fff;color:#000;border:2px solid #000}
  .databar.is-example{background:#fff;color:#000;border:1px solid #000}
  .rk-chips,.rk-lb,.mob{display:none!important}
  .rs-num{color:#000}
}

/* ══ 사고물질 선택 목록 ═════════════════════════════════ */
.mpk{position:fixed;z-index:900;background:#fff;border:1px solid var(--brand);
  border-radius:8px;box-shadow:0 6px 24px rgba(16,32,48,.18);overflow:hidden;
  display:flex;flex-direction:column}
.mpk-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:6px 11px;background:var(--brand-l);border-bottom:1px solid #cfe0f0;
  font-size:11.5px;font-weight:700;color:var(--brand-d);white-space:nowrap}
.mpk-hd > span:first-child{overflow:hidden;text-overflow:ellipsis}
.mpk-hd .mpk-hint{font-weight:400;color:#4c7ba9;font-size:11px;white-space:nowrap;flex:none}
.mpk-list{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
  scrollbar-color:#9db4c8 #eef3f7}
.mpk-list::-webkit-scrollbar{width:11px}
.mpk-list::-webkit-scrollbar-track{background:#eef3f7}
.mpk-list::-webkit-scrollbar-thumb{background:#9db4c8;border-radius:6px;
  border:2px solid #eef3f7}
.mpk-list::-webkit-scrollbar-thumb:hover{background:#7794ad}
.mpk-row{display:flex;align-items:baseline;gap:8px;padding:6px 11px;cursor:pointer;
  border-bottom:1px solid var(--line2);line-height:1.4}
.mpk-row:last-child{border-bottom:0}
.mpk-row:hover,.mpk-row.on{background:var(--brand-l)}
.mpk-row.on{box-shadow:inset 3px 0 0 var(--brand)}
.mpk-row .nm{font-size:13.5px;font-weight:600;color:var(--ink);flex:1;min-width:0;
  overflow-wrap:anywhere}
.mpk-row .en{font-size:11px;color:var(--ink3);max-width:34%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex:none}
.mpk-row .cas{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;
  white-space:nowrap;flex:none}
.mpk-row .fq{font-size:10.5px;color:var(--ok);background:var(--ok-l);
  border-radius:20px;padding:1px 6px;white-space:nowrap;flex:none}
.mpk-none{padding:20px 12px;text-align:center;font-size:12.5px;color:var(--ink3);line-height:1.7}
.mpk-ft{padding:5px 11px;border-top:1px solid var(--line2);background:var(--panel);
  font-size:11px;color:var(--ink3)}
@media (max-width:560px){
  .mpk-row .en{display:none}
  .mpk-row .fq{display:none}
}

/* ══ 대피장소 지도에서 고르기 (두 도구 공용) ═══════════════════
   지도가 없어도 목록만으로 고를 수 있도록 좌우 2단으로 두었습니다.
   지도는 화면 픽셀 좌표계로 그립니다(assets/shmap.js 참고). 그래서 아래
   선 굵기·글자 크기는 그대로 화면 픽셀이며 확대해도 변하지 않습니다. */
.shmap-back{position:fixed;inset:0;z-index:1000;background:rgba(9,20,33,.55);
  display:flex;align-items:center;justify-content:center;padding:18px;
  animation:cbxFade .2s var(--ease) both}
.shmap{background:var(--card);border-radius:12px;width:100%;max-width:1080px;
  max-height:100%;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 18px 48px rgba(0,0,0,.3);animation:revealIn .3s var(--ease) both}
.shmap > header{display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:var(--brand-d);color:#fff;flex:none}
.shmap > header b{font-size:14.5px}
.shmap-src{margin-left:auto;font-size:11.5px;color:#bcd3ec;text-align:right}
.shmap-x{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff;
  padding:2px 9px;font-size:14px;line-height:1.4;flex:none}
.shmap-x:hover{background:rgba(255,255,255,.3)}

.shmap-bar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
  padding:11px 14px;border-bottom:1px solid var(--line2);background:var(--panel);flex:none}
.shmap-bar label{display:flex;flex-direction:column;gap:3px;
  font-size:11.5px;font-weight:700;color:var(--ink2)}
.shmap-bar select{width:auto;min-width:132px}
.shmap-hint{font-size:11.5px;color:var(--ink3);padding-bottom:6px}

/* 배경지도 고르기 */
.shmap-lyr{display:flex;gap:0;padding-bottom:1px}
.shmap-lyr button{padding:7px 11px;font-size:12.5px;border-radius:0;
  border-left-width:0;background:#fff}
.shmap-lyr button:first-child{border-radius:6px 0 0 6px;border-left-width:1px}
.shmap-lyr button:last-child{border-radius:0 6px 6px 0}
.shmap-lyr button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);
  color:#fff;font-weight:700}
.shmap-lyr button[aria-pressed=true] + button{border-left-color:var(--brand)}
.shmap-lyr button:disabled{background:var(--panel);color:var(--ink3);
  text-decoration:line-through}

/* 배경지도를 못 불러왔을 때의 안내 — 왜 안 되는지 적는다 */
.shmap-warn{padding:8px 14px;background:var(--warn-l);border-bottom:1px solid #ebd0a4;
  color:var(--warn);font-size:12px;line-height:1.55;flex:none;animation:slideDown .26s var(--ease) both}
.shmap-warn a{color:var(--brand-d);font-weight:700}

/* 영향 참고 반경 줄 — 사고지점을 찍으면 나타난다 */
.shmap-rad{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 14px;background:var(--brand-l);border-bottom:1px solid #bcd4ea;flex:none;
  animation:slideDown .26s var(--ease) both}
.shmap-rad .lb{font-size:11.5px;font-weight:700;color:var(--brand-d)}
.shmap-rad button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);
  color:#fff;font-weight:700}
input[type=text].shmap-radin{width:96px;padding:4px 8px;font-size:12.5px;flex:none}
.shmap-rad .src{font-size:11px;color:var(--brand-d);margin-left:4px}
.shmap-accbtn[aria-pressed=true]{background:var(--err);border-color:var(--err);
  color:#fff;font-weight:700}

.shmap-body{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);
  gap:0;min-height:0;flex:1}
.shmap-mapwrap{position:relative;background:#eaf0f5;border-right:1px solid var(--line2);
  min-height:320px}
.shmap-svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;
  cursor:grab;display:block}
.shmap-svg:active{cursor:grabbing}
.shmap-svg .bg{fill:#eef3f7}
.shmap-svg .bds .bd{fill:none;stroke:#9fb2c4;stroke-width:.8px}
.shmap-svg .bds .bd.on{stroke:var(--brand);stroke-width:1.6px}
.shmap-svg.crosshair{cursor:crosshair}
.shmap-svg .ring{fill:rgba(179,31,31,.07);stroke:var(--err);
  stroke-width:1.6px;stroke-dasharray:6 4}
.shmap-svg .acc{stroke:var(--err);stroke-width:2.4px}
.shmap-svg .accdot{fill:none;stroke:var(--err);stroke-width:1.6px}
.shmap-svg text.acclbl{fill:var(--err);text-anchor:middle;font-weight:700;
  paint-order:stroke;stroke:#fff;stroke-width:.3em;pointer-events:none}
.shmap-svg circle.mk.in{fill:#fdeaea;stroke:var(--err)}
.shmap-svg circle.mk.on.in{fill:var(--err);stroke:#fff}
.shmap-svg circle.mk{fill:#fff;stroke:var(--brand);cursor:pointer;
  stroke-width:1.4px}
.shmap-svg circle.mk.hv{fill:var(--brand-l)}
.shmap-svg circle.mk.on{fill:var(--brand);stroke:#fff;stroke-width:2px}

/* 배경지도가 깔렸을 때 — 도로·건물 위에서 묻히지 않게 대비를 올린다.
   경계선은 얇게(배경을 가리지 않도록), 마커는 그림자를 넣어 도드라지게. */
.shmap-svg.hasbg .bg{fill:#dfe6ec}
.shmap-svg.hasbg .bds .bd{stroke:rgba(11,87,164,.30);stroke-width:.7px}
.shmap-svg.hasbg .bds .bd.on{stroke:#b31f1f;stroke-width:2px;
  stroke-dasharray:7 4;stroke-linejoin:round}
.shmap-svg.hasbg circle.mk{stroke-width:2px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.shmap-svg.hasbg circle.mk.on{stroke-width:2.5px}
.shmap-svg.hasbg text.mkl{stroke-width:.34em}
.shmap-svg text.mkl{fill:#12181f;text-anchor:middle;paint-order:stroke;
  stroke:#fff;stroke-width:.28em;stroke-linejoin:round;font-weight:600;pointer-events:none}
.shmap-svg text.mkl.on{fill:var(--brand-d)}
.shmap-svg text.mkh{fill:#5c6b7a;text-anchor:middle;paint-order:stroke;
  stroke:#fff;stroke-width:.3em;pointer-events:none}
.shmap-ctl{position:absolute;right:9px;top:9px;display:flex;flex-direction:column;gap:4px}
.shmap-ctl button{width:31px;height:31px;padding:0;font-size:15px;line-height:1;
  background:rgba(255,255,255,.95)}
.shmap-scale{position:absolute;left:10px;bottom:9px;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.9);border-radius:4px;padding:2px 7px;font-size:11px}
.shmap-scale i{display:block;height:4px;border:1px solid var(--ink2);border-top:0}
.shmap-scale b{font-variant-numeric:tabular-nums;color:var(--ink2)}

/* 지도 아래 주소 표시 — 고른 곳이 어디쯤인지 확인 */
.shmap-addr{position:absolute;left:10px;right:10px;bottom:34px;
  background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:7px;
  padding:7px 11px;font-size:12.5px;line-height:1.5;
  box-shadow:0 2px 8px rgba(0,0,0,.14);pointer-events:none;
  animation:revealIn .26s var(--ease) both}
.shmap-addr b{font-weight:700}
.shmap-addr i{font-style:normal;font-size:11.5px;color:var(--ink3);margin-left:4px}
.shmap-addr span{display:block;color:var(--ink2);font-size:11.5px}
.shmap-addr em{font-style:normal;font-size:11.5px;color:var(--brand-d);font-weight:600}
.shmap-addr em + em::before{content:" · ";color:var(--ink3);font-weight:400}

.shmap-side{display:flex;flex-direction:column;min-height:0;min-width:0}
.shmap-lh{padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink2);
  border-bottom:1px solid var(--line2);flex:none}
.shmap-tools{display:flex;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line2);
  background:var(--panel);flex:none}
.shmap-tools input[type=text].shmap-q{flex:1;min-width:0;padding:5px 9px;font-size:12.5px}
.shmap-tools .shmap-sort{width:auto;flex:none;padding:5px 6px;font-size:12px}
.shmap-lh .shmap-cnt{font-weight:400;color:var(--ink3)}
.shmap-list{overflow-y:auto;flex:1;min-height:0;scrollbar-gutter:stable}
.shmap-none{padding:16px 12px;font-size:12.5px;color:var(--ink3)}
.shmap-it{padding:8px 12px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:12.5px}
.shmap-it:hover{background:var(--panel)}
.shmap-it.on{background:var(--brand-l);box-shadow:inset 3px 0 0 var(--brand)}
.shmap-it .l1{display:flex;align-items:center;gap:6px}
.shmap-it .l1 input{width:14px;height:14px;margin:0;flex:none;pointer-events:none;
  accent-color:var(--brand)}
.shmap-it .l1 b{font-weight:700}
.shmap-it .l1 .dt{font-weight:400;font-size:11.5px;color:var(--ink3)}
.shmap-it .l2{color:var(--ink2);font-size:11.5px;margin-top:2px;line-height:1.5}
.shmap-it .l3{color:var(--brand-d);font-size:11.5px;margin-top:2px}
.shmap-it .l1 .d{margin-left:auto;flex:none;font-size:11.5px;font-weight:700;
  color:var(--brand-d);font-variant-numeric:tabular-nums}
.shmap-it .l5{margin-top:3px;font-size:11.5px;font-weight:600;color:var(--err)}
.shmap-it.ring{background:var(--err-l)}
.shmap-it.ring:hover{background:#fbdede}
.shmap-it.ring.on{background:#f8d4d4;box-shadow:inset 3px 0 0 var(--err)}
.shmap-it .l4{margin-top:4px}
.shmap-ext{display:flex;gap:6px}
.shmap-ext a{font-size:11px;text-decoration:none;color:var(--brand-d);font-weight:600;
  border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:#fff}
.shmap-ext a:hover{border-color:var(--brand);background:var(--brand-l)}

.shmap > footer{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-top:1px solid var(--line);background:var(--panel);flex:none;flex-wrap:wrap}
.shmap-tg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink2)}
.shmap-tg select{width:auto;min-width:150px}
.shmap-sum{margin-left:auto;font-size:12px;font-weight:700;color:var(--brand-d);
  font-variant-numeric:tabular-nums}
.shmap-sum + .shmap-ok{margin-left:10px}
.shmap-ok{margin-left:auto}

@media (max-width:820px){
  .shmap-back{padding:0}
  .shmap{max-width:none;border-radius:0;height:100%}
  .shmap-body{grid-template-columns:1fr;grid-template-rows:minmax(240px,42%) minmax(0,1fr)}
  .shmap-mapwrap{border-right:0;border-bottom:1px solid var(--line2)}
  .shmap-hint{display:none}
  .shmap-ok{margin-left:0;flex:1}
}
@media print{ .shmap-back{display:none!important} }

<body class="mapapp">

<!-- 예시 자료 / 내부용 경고 띠 — 데이터에 따라 app.js 가 켭니다 -->

   그냥 픽셀이라 확대해도 변하지 않습니다.

   ── 시야(vb) 규약 ───────────────────────────────────────────
   {x, y, w, h}  세계좌표로 나타낸 보이는 범위
   {sw, sh}      그 범위가 그려질 화면 크기 (픽셀)
   ============================================================ */
(function () {
"use strict";

var TAU = Math.PI * 2;
var EQUATOR = 40075016.686;              // 적도 둘레 (m) = 세계좌표 1.0
var D2R = Math.PI / 180;

/* ── 투영 ─────────────────────────────────────────────────── */
function wx(lon) { return (+lon + 180) / 360; }
function wy(lat) {
  var l = Math.max(-85.05112878, Math.min(85.05112878, +lat));
  var s = Math.sin(l * D2R);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (2 * TAU);
}
function wxInv(x) { return x * 360 - 180; }
function wyInv(y) { return Math.atan(Math.sinh((0.5 - y) * TAU)) / D2R; }

/* 미터 ↔ 세계좌표 길이. 메르카토르는 등각이라 위도에 따라 축척이 달라진다. */
function mToWorld(m, lat) { return m / (EQUATOR * Math.cos(lat * D2R)); }
function worldToM(w, lat) { return w * EQUATOR * Math.cos(lat * D2R); }

/* ── 거리·방위 ────────────────────────────────────────────── */

/* 직선거리 (m) — 하버사인. 지형·도로를 고려하지 않는다. */
function distM(a, b, c, d) {
  var R = 6371000;
  var dLat = (c - a) * D2R, dLon = (d - b) * D2R;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2)
        + Math.cos(a * D2R) * Math.cos(c * D2R) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return Math.round(2 * R * Math.asin(Math.sqrt(s)));
}
/* 방위각 (도, 북=0) */
function bearing(a, b, c, d) {
  var y = Math.sin((d - b) * D2R) * Math.cos(c * D2R);
  var x = Math.cos(a * D2R) * Math.sin(c * D2R)
        - Math.sin(a * D2R) * Math.cos(c * D2R) * Math.cos((d - b) * D2R);
  return (Math.atan2(y, x) / D2R + 360) % 360;
