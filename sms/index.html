<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화학사고 주민대피 문자생성기</title>
<!-- ══ 바탕화면에 놓고 쓰기 (웹앱) ═════════════════════════════
     웹서버에 올렸을 때만 쓰이는 줄들입니다. file:// 로 열거나 망분리용
     단일 파일에서는 브라우저가 조용히 무시합니다(build_single.py 가
     아예 빼기도 합니다). 그래서 여기 있어도 기존 사용법은 그대로입니다.

     매니페스트는 사이트 뿌리에 하나뿐이고 도구 세 개가 같이 씁니다.
     그래서 이 화면에서 설치해도 앱을 열면 **진입 화면**이 뜹니다
     (manifest 의 start_url 이 뿌리이기 때문입니다) — 도구 하나만 깔리는
     것이 아니라 서비스 전체가 깔리는 것이 맞습니다.
     ══════════════════════════════════════════════════════════ -->
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#256ef4">
<link rel="apple-touch-icon" href="../assets/img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- 아이폰은 매니페스트의 short_name 이 아니라 이 값을 홈 화면 이름으로 씁니다 -->
<meta name="apple-mobile-web-app-title" content="화학사고 초동대응">
<!-- 탭 아이콘 — 그림을 주소 안에 그대로 적었습니다. 파일을 하나 더 받지
     않고, file:// 로 열 때도 단일 파일에서도 똑같이 보입니다. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='96' fill='%23256ef4'/><path d='M256 92 402 146v118c0 78-68 138-146 164-78-26-146-86-146-164V146Z' fill='%23fff'/><circle cx='256' cy='252' r='82' fill='none' stroke='%230b50d0' stroke-width='22'/><circle cx='256' cy='252' r='26' fill='%230b50d0'/></svg>">

<!-- KRDS 공식 디자인 토큰 — 원본 그대로. shell.css 가 이 값을 우리 이름으로 잇습니다 -->
<link rel="stylesheet" href="../assets/krds/krds_tokens.css">
<link rel="stylesheet" href="../assets/shell.css">
<!-- 밝음·고대비 화면 — 그려지기 전에 정해야 하므로 head 에서 부릅니다 -->
<script src="../assets/theme.js"></script>
</head>
<body>

<div class="top">
  <div class="wrap">
    <h1>화학사고 주민대피 문자생성기</h1>
    <div class="act noprint">
      <button id="btnCases" type="button" hidden>실제 발송 사례</button>
      <button id="btnTxt" disabled>기록 저장</button>
      <button id="btnReset">초기화</button>
    </div>
  </div>

</div>

<!-- 주민 대피장소 찾기에서 값을 들고 왔을 때 무엇이 채워졌는지 알리는 띠.
     모르는 사이에 값이 바뀌어 있으면 그게 더 위험하므로 항목을 그대로 적는다.
     "어디서 왔는지"가 먼저, "지금 무엇을 쓰고 있는지"(아래 안내 띠)가 다음이다. -->
<div class="seedbar noprint" id="seedBar" hidden></div>

<!-- 안내 띠 — 발송 구분을 고른 뒤에만 나옵니다. 고르기 전에 "위에서 고르세요"
     같은 문구를 띄우면, 바로 아래 큰 단추 3개가 이미 그 말을 하고 있어
     같은 말을 두 번 하는 셈이 됩니다. -->
<div class="note noprint" id="noteWrap" hidden><div class="wrap" id="noteBar"></div></div>

<div class="wrap toolstage">

  <!-- 발송 단계 — 고르기 전엔 남는 공간 가운데에 크게, 고른 뒤엔 작은 띠로 접혀
       위로 올라간다(assets/shell.css 의 body.has-stage 규칙). -->
  <div class="stepsz" id="stepsZone">
    <div class="steps" id="stages"></div>
  </div>

  <!-- 진행 표시 — 지금 몇 걸음째인지, 앞뒤로 어디까지 왔는지.
       KRDS 의 단계 표시(step indicator) 방식입니다. 누르면 그 걸음으로 갑니다. -->
  <ol class="stepbar noprint" id="stepBar" hidden aria-label="작성 단계"></ol>

  <div class="cols" id="cols" hidden>

    <!-- 입력 걸음들이 들어가는 칸 — 마지막 걸음(문안 확인)에서는 감춥니다 -->
    <div class="panel" id="inPanel">
      <h2>사고정보 <span class="who" id="sessTag" hidden
          style="font-weight:400;color:var(--ink3)">이전 입력 이어받음</span></h2>
      <div class="body">

        <div class="step" data-step="type">
          <div class="sect">사고유형</div>
          <div class="chips" id="types"></div>
        </div>

        <div id="fCommon" class="fcommon"></div>
        <div id="matInfo" class="step" data-step="mat"></div>

        <div class="step" data-step="evac">
        <div id="evacWrap" hidden>
          <div class="sect">대피장소·집결지</div>
          <div class="grid" id="fEvac"></div>

          <div class="row" style="margin-top:9px">
            <button class="sm p" id="btnMap" type="button">지도에서 찾기</button>
            <button class="sm" id="btnFinder" type="button">목록에서 찾기</button>
            <a class="sm btnlink" href="../map/index.html" target="_blank" rel="noopener">지도 도구 열기 (거리·반경)</a>
          </div>

          <div class="finder" id="finder" hidden>
            <div class="grid" style="grid-template-columns:1fr 1fr">
              <div class="f">
                <label for="sSido">시·도</label>
                <select id="sSido"></select>
              </div>
              <div class="f">
                <label for="sSgg">시·군·구</label>
                <select id="sSgg"></select>
              </div>
              <div class="f wide">
                <label for="sList">대피장소 <span class="cntlbl" id="sCnt"></span></label>
                <select id="sList" multiple size="6"></select>
              </div>
              <div class="f wide">
                <label for="shTarget">선택한 곳을 넣을 칸</label>
                <div class="row">
                  <select id="shTarget" style="flex:1"></select>
                  <button class="sm p" id="btnPick" type="button">넣기</button>
                </div>
              </div>
            </div>
          </div>

          <label class="chk" style="margin-top:11px">
            <input type="checkbox" id="use71">
            <span>7-1번 추가 안내도 작성 (차량 이용 · 자력대피 곤란자 · 반려동물 · 거동불편자)</span>
          </label>
          <div class="grid" id="fEvacExtra" hidden style="margin-top:9px"></div>
        </div>
        </div>

      </div>
    </div>

    <!-- 오른쪽: 생성 문안 -->
    <div class="panel sticky step" data-step="out">
      <h2>생성 문안 <span id="outCnt" style="font-weight:400;color:var(--ink3)"></span></h2>
      <div class="body">
        <!-- 한 발송 구분 안에서 상황에 따라 문안이 갈릴 때 고르는 줄
             (지금은 도로 우회 알림만 — 사고지역이 실내대피 중인가 대피명령 중인가).
             바뀌는 것이 바로 아래 문안 묶음이므로 그 위에 작게 둡니다. -->
        <div class="catbar noprint" id="catBar" hidden></div>
        <div id="alerts"></div>
        <div id="out"></div>
      </div>
    </div>

  </div>

  <!-- 걸음 사이 이동 — 다음 단추에 다음 걸음의 이름을 적습니다.
       "다음"만 있으면 무엇이 나올지 모르고 누르게 됩니다. -->
  <div class="stepnav noprint" id="stepNav" hidden></div>

</div>

<div class="cbx-back" id="casesModal" hidden>
  <div class="cbx">
    <header><b>다른 지자체 실제 발송 사례</b><span class="cbx-n" id="caseN"></span>
      <button type="button" class="cbx-x" id="btnCasesClose" aria-label="닫기">✕</button></header>
    <div class="alert w cbx-alert"><b>주의</b>실제 발송된 원문입니다. 승인된 표준문안이 아니며
      오탈자·표기 오류가 포함되어 있습니다. 그대로 복사하지 마세요.</div>
    <div class="cbx-bar">
      <label for="caseF">물질</label>
      <select id="caseF"></select>
    </div>
    <div class="cbx-body" id="caseList"></div>
  </div>
</div>

<script src="../data/version.js"></script>
<script src="../data/basemap.js"></script>
<script src="../data/templates.js"></script>
<script src="../data/materials.js"></script>
<script src="../data/stats.js"></script>
<script src="../data/shelters.js"></script>
<script src="../data/boundaries.js"></script>
<script src="../data/cases.js"></script>
<script src="../assets/matpicker.js"></script>
<script src="../assets/mapcore.js"></script>
<script src="../assets/shmap.js"></script>
<script src="app.js"></script>

<!-- 웹앱 설치용. 서버에 올렸을 때만 돌고, file:// 에서는 아무 일도 하지
     않습니다. 설치 안내 줄은 진입 화면에만 답니다 — 일하는 화면에는
     일과 상관없는 것을 얹지 않습니다. -->
<script src="../assets/pwa.js"></script>
</body>
</html>
